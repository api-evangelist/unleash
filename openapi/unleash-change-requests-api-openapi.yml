    updateChangeRequestEnvironmentConfigSchema:
      type: object
      description: Data used to update change request in an environment
      required:
      - changeRequestsEnabled
      properties:
        changeRequestsEnabled:
          type: boolean
          description: '`true` if change requests should be enabled, otherwise `false`.'
        requiredApprovals:
          type: integer
          description: The number of approvals required before a change request can be applied in this environment.
          minimum: 0
          example: 3
    variantSchema:
      type: object
      additionalProperties: false
      description: A variant allows for further separation of users into segments. See [our excellent documentation](https://docs.getunleash.io/concepts/feature-flag-variants#what-are-variants) for a more detailed description
      required:
      - name
      - weight
      properties:
        name:
          type: string
          description: The variants name. Is unique for this feature flag
          example: blue_group
        weight:
          type: number
          description: The weight is the likelihood of any one user getting this variant. It is a number between 0 and 1000. See the section on [variant weights](https://docs.getunleash.io/concepts/feature-flag-variants#variant-weight) for more information
          minimum: 0
          maximum: 1000
        weightType:
          description: Set to fix if this variant must have exactly the weight allocated to it. If the type is variable, the weight will adjust so that the total weight of all variants adds up to 1000
          type: string
          example: variable
          enum:
          - variable
          - fix
        stickiness:
          type: string
          description: '[Stickiness](https://docs.getunleash.io/concepts/feature-flag-variants#variant-stickiness) is how Unleash guarantees that the same user gets the same variant every time'
          example: custom.context.field
        payload:
          type: object
          required:
          - type
          - value
          description: Extra data configured for this variant
          additionalProperties: false
          properties:
            type:
              description: The type of the value. Commonly used types are string, number, json and csv.
              type: string
              enum:
              - json
              - csv
              - string
              - number
            value:
              description: The actual value of payload
              type: string
          example:
            type: json
            value: '{"color": "red"}'
        overrides:
          description: Overrides assigning specific variants to specific users. The weighting system automatically assigns users to specific groups for you, but any overrides in this list will take precedence.
          type: array
          items:
            $ref: '#/components/schemas/overrideSchema'
    changeRequestSegmentChangeSchema:
      type: object
      additionalProperties: false
      description: A change request segment change, containing info about the type of segment change and the specific changes.
      required:
      - id
      - action
      - payload
      - name
      properties:
        id:
          type: number
          example: 33
          description: The ID of this change.
        action:
          type: string
          example: updateStrategy
          description: The kind of action that the change contains information about.
        conflict:
          type: string
          example: Strategy has been deleted
          description: A description of the conflict caused by this change. Only present if there are any conflicts.
        payload:
          description: The data required to perform this action.
          oneOf:
          - type: string
          - type: boolean
          - type: object
          - type: number
          - $ref: '#/components/schemas/setStrategySortOrderSchema'
        createdBy:
          type: object
          description: The user who created this change.
          properties:
            username:
              type: string
              nullable: true
              description: The user's username.
            imageUrl:
              type: string
              nullable: true
              format: uri
              description: The URL where the user's image can be found.
        createdAt:
          description: When this change was suggested
          type: string
          format: date-time
          example: '2023-07-31T13:22:03+02:00'
        scheduleConflicts:
          description: Information about scheduled change requests that would casue conflicts with this change if applied.
          type: object
          required:
          - changeRequests
          properties:
            changeRequests:
              type: array
              description: The list of scheduled change requests that would cause conflict with this change.
              items:
                type: object
                required:
                - id
                properties:
                  id:
                    type: number
                    description: The ID of the change request.
                  title:
                    type: string
                    description: The title of the change request, if any. Only present if there is a title.
        name:
          type: string
          example: beta-users
          description: The current name of the segment
    overrideSchema:
      type: object
      additionalProperties: false
      required:
      - contextName
      - values
      description: An override for deciding which variant should be assigned to a user based on the context name
      properties:
        contextName:
          description: The name of the context field used to determine overrides
          type: string
          example: userId
        values:
          description: Which values that should be overriden
          type: array
          items:
            type: string
          example:
          - red
          - blue
    changeRequestChangeSchema:
      type: object
      additionalProperties: false
      description: A change request change, containing info about the type of change and the specific changes.
      required:
      - id
      - action
      properties:
        id:
          type: number
          example: 33
          description: The ID of this change.
        action:
          type: string
          example: updateStrategy
          description: The kind of action that the change contains information about.
        conflict:
          type: string
          example: Strategy has been deleted
          description: A description of the conflict caused by this change. Only present if there are any conflicts.
        payload:
          description: The data required to perform this action.
          oneOf:
          - type: string
          - type: boolean
          - type: object
          - type: number
          - $ref: '#/components/schemas/setStrategySortOrderSchema'
        createdBy:
          type: object
          description: The user who created this change.
          properties:
            username:
              type: string
              nullable: true
              description: The user's username.
            imageUrl:
              type: string
              nullable: true
              format: uri
              description: The URL where the user's image can be found.
        createdAt:
          description: When this change was suggested
          type: string
          format: date-time
          example: '2023-07-31T13:22:03+02:00'
        scheduleConflicts:
          description: Information about scheduled change requests that would casue conflicts with this change if applied.
          type: object
          required:
          - changeRequests
          properties:
            changeRequests:
              type: array
              description: The list of scheduled change requests that would cause conflict with this change.
              items:
                type: object
                required:
                - id
                properties:
                  id:
                    type: number
                    description: The ID of the change request.
                  title:
                    type: string
                    description: The title of the change request, if any. Only present if there is a title.
    changeRequestDefaultChangeSchema:
      type: object
      description: 'A description of a default change that will be applied with the change request to prevent invalid states.


        Default changes are changes that are applied in addition to explicit user-specified changes when a change request is applied. Any default changes are applied in the background and are not a real part of the change request.'
      additionalProperties: false
      required:
      - action
      - payload
      properties:
        action:
          type: string
          example: addStrategy
          description: The kind of action this is.
        payload:
          type: object
          description: The necessary data to perform this change.
          x-enforcer-exception-skip-codes: WSCH006
          example:
            name: flexibleRollout
            title: ''
            disabled: false
            segments: []
            parameters:
              groupId: my-feature
              rollout: '100'
              stickiness: default
            constraints:
            - values:
              - ux
              inverted: false
              operator: STR_CONTAINS
              contextName: userId
              caseInsensitive: false
    createDependentFeatureSchema:
      type: object
      description: Feature dependency on a parent feature in write model
      required:
      - feature
      properties:
        feature:
          type: string
          description: The name of the feature we depend on.
          example: parent_feature
        enabled:
          type: boolean
          description: Whether the parent feature should be enabled. When `false` variants are ignored. `true` by default.
          example: false
        variants:
          type: array
          description: The list of variants the parent feature should resolve to. Leave empty when you only want to check the `enabled` status.
          items:
            type: string
          example:
          - variantA
          - variantB
    releasePlanTemplateIdSchema:
      additionalProperties: false
      description: Schema for creating a release plan for a feature flag environment by copying and applying the configuration from a release plan template.
      type: object
      required:
      - templateId
      properties:
        templateId:
          type: string
          description: The release plan template's ID. Release template IDs are ulids.
          example: 01JB9GGTGQYEQ9D40R17T3YVW2
          nullable: false
    changeRequestScheduledResultSchema:
      description: A list of scheduled change request view models
      type: array
      items:
        $ref: '#/components/schemas/scheduledChangeRequestViewModelSchema'
    changeRequestOneOrManyCreateSchema:
      description: Either a single change or a list of changes to create a change request from.
      oneOf:
      - type: object
        required:
        - payload
        - action
        properties:
          action:
            type: string
            enum:
            - updateSegment
            description: The name of this action.
          payload:
            required:
            - id
            $ref: '#/components/schemas/upsertSegmentSchema'
            type: object
            properties:
              id:
                type: integer
                description: The ID of the segment to update.
                example: 1
      - type: object
        required:
        - payload
        - action
        properties:
          action:
            type: string
            enum:
            - deleteSegment
            description: The name of this action.
          payload:
            required:
            - id
            type: object
            description: Required data to delete a segment.
            properties:
              id:
                type: integer
                description: The ID of the segment to delete.
                example: 1
      - type: object
        description: Update the enabled state for a feature.
        required:
        - feature
        - payload
        - action
        properties:
          feature:
            type: string
            example: my-best-feature
            description: The name of the feature that this change applies to.
          action:
            type: string
            enum:
            - updateEnabled
            description: The name of this action.
          payload:
            required:
            - enabled
            type: object
            properties:
              enabled:
                type: boolean
                example: true
                description: The new state of the feature.
              shouldActivateDisabledStrategies:
                type: boolean
                example: true
                description: Only relevant when ALL the strategies are disabled. If `true`, all the disabled strategies will be enabled. If `false`, the default strategy will be added
      - type: object
        required:
        - feature
        - payload
        - action
        description: Add a strategy to the feature
        properties:
          feature:
            type: string
            example: my-best-feature
            description: The name of the feature that this change applies to.
          action:
            type: string
            enum:
            - addStrategy
            description: The name of this action.
          payload:
            required:
            - constraints
            - parameters
            - name
            $ref: '#/components/schemas/createFeatureStrategySchema'
            type: object
      - type: object
        required:
        - feature
        - payload
        - action
        description: Update a strategy belonging to this feature.
        properties:
          feature:
            type: string
            example: my-best-feature
            description: The name of the feature that this change applies to.
          action:
            type: string
            enum:
            - updateStrategy
            description: The name of this action.
          payload:
            required:
            - id
            $ref: '#/components/schemas/updateFeatureStrategySchema'
            type: object
            properties:
              id:
                type: string
                example: 0103487d-8788-4cda-af59-0a68642dbc5a
                description: The ID of the strategy to update.
      - type: object
        required:
        - feature
        - payload
        - action
        description: Delete a strategy from this feature.
        properties:
          feature:
            type: string
            example: my-best-feature
            description: The name of the feature that this change applies to.
          action:
            type: string
            enum:
            - deleteStrategy
            description: The name of this action.
          payload:
            required:
            - id
            type: object
            properties:
              id:
                type: string
                example: 0103487d-8788-4cda-af59-0a68642dbc5a
                description: The ID of the strategy to update.
      - type: object
        required:
        - feature
        - action
        description: Archive a feature.
        properties:
          feature:
            type: string
            example: my-best-feature
            description: The name of the feature that this change applies to.
          action:
            type: string
            enum:
            - archiveFeature
            description: The name of this action.
      - type: object
        required:
        - feature
        - payload
        - action
        description: Update variants for this feature.
        properties:
          feature:
            type: string
            example: my-best-feature
            description: The name of the feature that this change applies to.
          action:
            type: string
            enum:
            - patchVariant
            description: The name of this action.
          payload:
            type: object
            required:
            - variants
            properties:
              variants:
                type: array
                items:
                  $ref: '#/components/schemas/variantSchema'
      - type: object
        required:
        - feature
        - payload
        - action
        description: Reorder strategies for this feature
        properties:
          feature:
            type: string
            example: my-best-feature
            description: The name of the feature that this change applies to.
          action:
            type: string
            enum:
            - reorderStrategy
            description: The name of this action.
          payload:
            $ref: '#/components/schemas/setStrategySortOrderSchema'
      - type: object
        required:
        - feature
        - payload
        - action
        description: Add a parent feature dependency.
        properties:
          feature:
            type: string
            example: my-best-feature
            description: The name of the feature that this change applies to.
          action:
            type: string
            enum:
            - addDependency
            description: The name of this action.
          payload:
            $ref: '#/components/schemas/createDependentFeatureSchema'
            type: object
      - type: object
        required:
        - feature
        - action
        description: Remove a parent feature dependency or all dependencies if no payload.
        properties:
          feature:
            type: string
            example: my-best-feature
            description: The name of the feature that this change applies to.
          action:
            type: string
            enum:
            - deleteDependency
            description: The name of this action.
      - type: object
        required:
        - feature
        - payload
        - action
        description: Add a release plan to this feature environment.
        properties:
          feature:
            type: string
            example: my-best-feature
            description: The name of the feature that this change applies to.
          action:
            type: string
            enum:
            - addReleasePlan
            description: The name of this action.
          payload:
            $ref: '#/components/schemas/releasePlanTemplateIdSchema'
            type: object
      - type: object
        required:
        - feature
        - payload
        - action
        description: Start milestone of feature environment release plan.
        properties:
          feature:
            type: string
            example: my-best-feature
            description: The name of the feature that this change applies to.
          action:
            type: string
            enum:
            - startMilestone
            description: The name of this action.
          payload:
            type: object
            required:
            - milestoneId
            - planId
            description: The ID of the release plan and which of its milestones to start.
            properties:
              milestoneId:
                type: string
                example: 01JB9GGTGQYEQ9D40R17T3YVW3
                description: The ID of the milestone to start. This ID is an ulid
              planId:
                type: string
                example: 01JB9GGTGQYEQ9D40R17T3YVW3
                description: The ID of the release plan. This ID is an ulid
      - type: object
        required:
        - feature
        - payload
        - action
        description: Remove a release plan from feature environment.
        properties:
          feature:
            type: string
            example: my-best-feature
            description: The name of the feature that this change applies to.
          action:
            type: string
            enum:
            - deleteReleasePlan
            description: The name of this action.
          payload:
            type: object
            required:
            - planId
            description: The Id of the release plan to remove.
            properties:
              planId:
                type: string
                example: 01JB9GGTGQYEQ9D40R17T3YVW3
                description: The Id of the release plan. This id is an ulid
      - type: object
        required:
        - feature
        - payload
        - action
        description: Create or update milestone progression from one milestone to another.
        properties:
          feature:
            type: string
            example: my-best-feature
            description: The name of the feature that this change applies to.
          action:
            type: string
            enum:
            - changeMilestoneProgression
            description: The name of this action.
          payload:
            type: object
            required:
            - sourceMilestone
            - targetMilestone
            - transitionCondition
            properties:
              sourceMilestone:
                type: string
                example: 01K7NXD655W7R89659K58RE07A
                description: The ID of the source milestone
              targetMilestone:
                type: string
                example: 11K7NXD655W7R89659K58RE07B
                description: The ID of the target milestone
              transitionCondition:
                $ref: '#/components/schemas/transitionConditionSchema'
                description: The condition configuration for the transition
      - type: object
        required:
        - feature
        - payload
        - action
        description: Delete milestone progression.
        properties:
          feature:
            type: string
            example: my-best-feature
            description: The name of the feature that this change applies to.
          action:
            type: string
            enum:
            - deleteMilestoneProgression
            description: The name of this action.
          payload:
            type: object
            required:
            - sourceMilestone
            properties:
              sourceMilestone:
                type: string
                example: 01K7NXD655W7R89659K58RE07A
                description: The ID of the source milestone with progression to delete.
      - type: object
        required:
        - feature
        - payload
        - action
        description: Resume paused milestone progressions for a release plan.
        properties:
          feature:
            type: string
            example: my-best-feature
            description: The name of the feature that this change applies to.
          action:
            type: string
            enum:
            - resumeMilestoneProgression
            description: The name of this action.
          payload:
            type: object
            required:
            - planId
            properties:
              planId:
                type: string
                example: 01JB9GGTGQYEQ9D40R17T3YVW3
                description: The release plan's unique identifier (ULID format)
      - type: object
        required:
        - feature
        - payload
        - action
        description: Create or update a safeguard for a release plan.
        properties:
          feature:
            type: string
            example: my-best-feature
            description: The name of the feature that this change applies to.
          action:
            type: string
            enum:
            - changeSafeguard
            description: The name of this action.
          payload:
            type: object
            required:
            - planId
            - safeguard
            properties:
              planId:
                type: string
                example: 01JB9GGTGQYEQ9D40R17T3YVW3
                description: The ID of the release plan. This ID is an ulid
              safeguard:
                $ref: '#/components/schemas/createSafeguardSchema'
      - type: object
        required:
        - feature
        - payload
        - action
        description: Delete a safeguard from a release plan.
        properties:
          feature:
            type: string
            example: my-best-feature
            description: The name of the feature that this change applies to.
          action:
            type: string
            enum:
            - deleteSafeguard
            description: The name of this action.
          payload:
            type: object
            required:
            - planId
            - safeguardId
            properties:
              planId:
                type: string
                example: 01JB9GGTGQYEQ9D40R17T3YVW3
                description: The ID of the release plan. This ID is an ulid
              safeguardId:
                type: string
                example: 01K7NXD655W7R89659K58RE07A
                description: The ID of the safeguard to delete.
      - type: array
        items:
          $ref: '#/components/schemas/changeRequestCreateSchema'
    changeRequestSearchResponseSchema:
      type: object
      description: Response containing a list of change requests and total count.
      required:
      - changeRequests
      - total
      additionalProperties: false
      properties:
        changeRequests:
          type: array
          description: List of change requests matching the search criteria.
          items:
            $ref: '#/components/schemas/changeRequestSearchItemSchema'
        total:
          type: number
          description: Total number of change requests matching the search criteria.
          example: 42
    setStrategySortOrderSchema:
      type: array
      description: An array of strategies with their new sort order
      items:
        type: object
        additionalProperties: false
        required:
        - id
        - sortOrder
        description: A strategy with its new sort order
        properties:
          id:
            type: string
            example: 9c40958a-daac-400e-98fb-3bb438567008
            description: The ID of the strategy
          sortOrder:
            type: number
            example: 1
            description: The new sort order of the strategy
    createFeatureStrategySchema:
      type: object
      required:
      - name
      description: Create a strategy configuration in a feature
      properties:
        name:
          type: string
          description: The name of the strategy type
          example: flexibleRollout
        title:
          type: string
          nullable: true
          description: A descriptive title for the strategy
          example: Gradual Rollout 25-Prod
        disabled:
          type: boolean
          description: A toggle to disable the strategy. defaults to false. Disabled strategies are not evaluated or returned to the SDKs
          example: false
          nullable: true
        sortOrder:
          type: number
          description: The order of the strategy in the list
          example: 9999
        constraints:
          type: array
          description: A list of the constraints attached to the strategy. See https://docs.getunleash.io/concepts/activation-strategies#constraints
          example:
          - values:
            - '1'
            - '2'
            inverted: false
            operator: IN
            contextName: appName
            caseInsensitive: false
          items:
            $ref: '#/components/schemas/constraintSchema'
        variants:
          type: array
          description: Strategy level variants
          items:
            $ref: '#/components/schemas/createStrategyVariantSchema'
        parameters:
          description: An object containing the parameters for the strategy
          example:
            groupId: some_new
            rollout: '25'
            stickiness: sessionId
          $ref: '#/components/schemas/parametersSchema'
        segments:
          type: array
          description: Ids of segments to use for this strategy
          example:
          - 1
          - 2
          items:
            type: number
    transitionConditionSchema:
      type: object
      additionalProperties: false
      required:
      - intervalMinutes
      description: A transition condition for milestone progression
      properties:
        intervalMinutes:
          type: integer
          minimum: 1
          description: The interval in minutes before transitioning
          example: 30
    changeRequestAvailableReviewersSchema:
      additionalProperties: false
      type: object
      description: A list of users available to review a change request.
      required:
      - reviewers
      properties:
        reviewers:
          type: array
          description: a list of reviewers
          items:
            $ref: '#/components/schemas/changeRequestReviewerSchema'
    parametersSchema:
      type: object
      description: A list of parameters for a strategy
      additionalProperties:
        type: string
    changeRequestApprovalSchema:
      additionalProperties: false
      type: object
      description: Information about a [change request](https://docs.getunleash.io/concepts/change-requests) approval.
      required:
      - createdBy
      - createdAt
      properties:
        createdBy:
          type: object
          description: Information about the user who gave this approval.
          properties:
            id:
              type: number
              example: 33
              description: The ID of the user who gave this approval.
            username:
              type: string
              example: unleash-user
              description: The approving user's username.
            imageUrl:
              type: string
              format: uri
              description: The URL where the user's image can be found.
        createdAt:
          type: string
          format: date-time
          example: '2022-12-12T12:13:24.218Z'
          description: When the approval was given.
    changeRequestSchema:
      type: object
      description: A [change request](https://docs.getunleash.io/concepts/change-requests)
      oneOf:
      - required:
        - id
        - environment
        - state
        - minApprovals
        - project
        - features
        - segments
        - createdAt
        - createdBy
        - stateTimestamps
        additionalProperties: false
        properties:
          id:
            type: number
            example: 3
            description: This change requests's ID.
          title:
            type: string
            example: Increasing gradual rollout
            description: A title describing the change request's content.
          environment:
            type: string
            example: development
            description: The environment in which the changes should be applied.
          minApprovals:
            type: number
            example: 2
            description: The minimum number of approvals required before this change request can be applied.
          project:
            type: string
            example: unleash-project
            description: The project this change request belongs to.
          features:
            type: array
            description: The list of features and their changes that relate to this change request.
            items:
              $ref: '#/components/schemas/changeRequestFeatureSchema'
          segments:
            type: array
            description: The list of segments and their changes that relate to this change request.
            items:
              $ref: '#/components/schemas/changeRequestSegmentChangeSchema'
          approvals:
            type: array
            description: A list of approvals that this change request has received.
            items:
              $ref: '#/components/schemas/changeRequestApprovalSchema'
          rejections:
            type: array
            description: 'A list of rejections that this change request has received. '
            items:
              $ref: '#/components/schemas/changeRequestApprovalSchema'
          comments:
            type: array
            description: All comments that have been made on this change request.
            items:
              $ref: '#/components/schemas/changeRequestCommentSchema'
          createdBy:
            description: The user who created this change request.
            type: object
            properties:
              username:
                type: string
                nullable: true
                example: Hunter
              imageUrl:
                type: string
                format: uri
                nullable: true
                description: The URL of the user's profile image.
          createdAt:
            description: When this change request was created.
            type: string
            format: date-time
            example: '2023-07-31T13:33:02Z'
          stateTimestamps:
            type: object
            description: A mapping of each state this change request has entered to the most recent time when it entered that state. If a change request has entered the same state multiple times, only the most recent timestamp will be included.
            additionalProperties:
              type: string
              format: date-time
              example: '2023-08-01T10:15:30Z'
            example:
              Draft: '2023-07-31T13:33:02Z'
              In review: '2023-08-01T10:15:30Z'
              Approved: '2023-08-02T09:01:00Z'
          state:
            type: string
            enum:
            - Draft
            - In review
            - Approved
            - Applied
            - Cancelled
            - Rejected
            description: The current state of the change request.
      - required:
        - id
        - environment
        - state
        - minApprovals
        - project
        - features
        - segments
        - createdAt
        - createdBy
        - stateTimestamps
        - schedule
        additionalProperties: false
        properties:
          id:
            type: number
            example: 3
            description: This change requests's ID.
          title:
            type: string
            example: Increasing gradual rollout
            description: A title describing the change request's content.
          environment:
            type: string
            example: development
            description: The environment in which the changes should be applied.
          minApprovals:
            type: number
            example: 2
            description: The minimum number of approvals required before this change request can be applied.
          project:
            type: string
            example: unleash-project
            description: The project this change request belongs to.
          features:
            type: array
            description: The list of features and their changes that relate to this change request.
            items:
              $ref: '#/components/schemas/changeRequestFeatureSchema'
          segments:
            type: array
            description: The list of segments and their changes that relate to this change request.
            items:
              $ref: '#/components/schemas/changeRequestSegmentChangeSchema'
          approvals:
            type: array
            description: A list of approvals that this change request has received.
            items:
              $ref: '#/components/schemas/changeRequestApprovalSchema'
          rejections:
            type: array
            description: 'A list of rejections that this change request has received. '
            items:
              $ref: '#/components/schemas/changeRequestApprovalSchema'
          comments:
            type: array
            description: All comments that have been made on this change request.
            items:
              $ref: '#/components/schemas/changeRequestCommentSchema'
          createdBy:
            description: The user who created this change request.
            type: object
            properties:
              username:
                type: string
                nullable: true
                example: Hunter
              imageUrl:
                type: string
                format: uri
                nullable: true
                description: The URL of the user's profile image.
          createdAt:
            description: When this change request was created.
            type: string
            format: date-time
            example: '2023-07-31T13:33:02Z'
          stateTimestamps:
            type: object
            description: A mapping of each state this change request has entered to the most recent time when it entered that state. If a change request has entered the same state multiple times, only the most recent timestamp will be included.
            additionalProperties:
              type: string
              format: date-time
              example: '2023-08-01T10:15:30Z'
            example:
              Draft: '2023-07-31T13:33:02Z'
              In review: '2023-08-01T10:15:30Z'
              Approved: '2023-08-02T09:01:00Z'
          state:
            type: string
            enum:
            - Scheduled
            description: The current state of the change request.
          schedule:
            $ref: '#/components/schemas/changeRequestScheduleSchema'
    safeguardTriggerConditionSchema:
      type: object
      required:
      - operator
      - threshold
      additionalProperties: false
      description: The condition that triggers the safeguard.
      properties:
        operator:
          type: string
          enum:
          - '>'
          - <
          description: The comparison operator for the threshold check.
          example: '>'
        threshold:
          type: number
          description: The threshold value to compare against.
          example: 100
    changeRequestFeatureSchema:
      additionalProperties: false
      description: A feature and all its suggested changes.
      type: object
      required:
      - name
      - changes
      properties:
        name:
          type: string
          example: my-feature
          description: The name of the feature
        conflict:
          type: string
          example: Feature has been archived
          description: A string describing the conflicts related to this change. Only present if there are any concflicts on the feature level.
        changes:
          type: array
          description: List of changes inside change request. This list may be empty when listing all change requests for a project.
          items:
            $ref: '#/components/schemas/changeRequestChangeSchema'
        defaultChange:
          $ref: '#/components/schemas/changeRequestDefaultChangeSchema'
    createSafeguardSchema:
      type: object
      required:
      - impactMetric
      - triggerCondition
      description: Request body to create a safeguard with metric-based alert condition.
      additionalProperties: false
      properties:
        impactMetric:
          type: object
          required:
          - metricName
          - timeRange
          - aggregationMode
          - labelSelectors
          properties:
            metricName:
              type: string
              description: The Prometheus metric series to query. It includes both unleash prefix and metric type and display name
              example: unleash_counter_feature_toggle_usage_total
            timeRange:
              type: string
              enum:
              - hour
              - day
              - week
              - month
              description: The time range for the metric data.
              example: day
            aggregationMode:
              type: string
              description: The aggregation mode for the metric data.
              enum:
              - rps
              - count
              - avg
              - sum
              - p95
              - p99
              - p50
              example: rps
            labelSelectors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
              description: The selected labels and their values for filtering the metric data.
              example:
                environment:
                - development
                project:
                - default
          description: Metric configuration that should be evaluated for the safeguard.
        triggerCondition:
          $ref: '#/components/schemas/safeguardTriggerConditionSchema'
          description: The condition that triggers the safeguard.
    changeRequestReviewerSchema:
      additionalProperties: false
      type: object
      description: Information about a user available to review a change request
      required:
      - id
      - email
      properties:
        id:
          type: number
          description: Id of the user available to review
          example: 23
        email:
          type: string
          example: email@example.com
          description: The email of the approving user
        username:
          type: string
          example: unleash-user
          nullable: true
          description: The username of the approving user
        name:
          type: string
          example: Reviewer Approver
          nullable: true
          description: The name of the approving user
        imageUrl:
          type: string
          nullable: true
          format: uri
          description: The URL where the user's image can be found.
    changeRequestAddCommentSchema:
      additionalProperties: false
      type: object
      description: Data used to add a comment to a [change request](https://docs.getunleash.io/concepts/change-requests).
      required:
      - text
      properties:
        text:
          type: string
          example: This is a comment
          description: The content of the comment.
    createStrategyVariantSchema:
      type: object
      description: This is an experimental property. It may change or be removed as we work on it. Please don't depend on it yet. A strategy variant allows you to attach any data to strategies instead of only returning `true`/`false`. Strategy variants take precedence over feature variants.
      required:
      - name
      - weight
      - weightType
      - stickiness
      properties:
        name:
          type: string
          description: The variant name. Must be unique for this feature flag
          example: blue_group
        weight:
          type: integer
          description: The weight is the likelihood of any one user getting this variant. It is an integer between 0 and 1000. See the section on [variant weights](https://docs.getunleash.io/concepts/feature-flag-variants#variant-weight) for more information
          minimum: 0
          maximum: 1000
        weightType:
          description: Set to `fix` if this variant must have exactly the weight allocated to it. If the type is `variable`, the weight will adjust so that the total weight of all variants adds up to 1000. Refer to the [variant weight documentation](https://docs.getunleash.io/concepts/feature-flag-variants#variant-weight).
          type: string
          example: fix
          enum:
          - variable
          - fix
        stickiness:
          type: string
          description: The [stickiness](https://docs.getunleash.io/concepts/feature-flag-variants#variant-stickiness) to use for distribution of this variant. Stickiness is how Unleash guarantees that the same user gets the same variant every time
          example: custom.context.field
        payload:
          type: object
          required:
          - type
          - value
          description: Extra data configured for this variant
          properties:
            type:
              description: The type of the value. Commonly used types are string, number, json and csv.
              type: string
              enum:
              - json
              - csv
              - string
              - number
            value:
              description: The actual value of payload
              type: string
          example:
            type: json
            value: '{"color": "red"}'
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: Authorization
      description: API key needed to access this API
    bearerToken:
      type: http
      scheme: bearer
      description: API key needed to access this API, in Bearer token format
