          title:
            type: string
            description: Title of the change request. Only present if a custom title is set for this change request.
            example: Increase rollout to 65%
          environment:
            type: string
            description: Environment where the change request applies.
            example: production
          project:
            type: string
            description: Project ID where the change request belongs.
            example: dx
          createdBy:
            type: object
            description: User who created the change request.
            required:
            - id
            additionalProperties: false
            properties:
              id:
                type: number
                description: Unique identifier of the user.
                example: 42
              username:
                type: string
                description: Username of the user.
                example: Tymek Czech
              imageUrl:
                type: string
                format: uri
                description: Avatar image URL for the user.
                example: https://gravatar.com/avatar/8f5a1ce5f210eb56f8d9a2ba1a5940c224c916d5e91159d4036fb46cc6d059dd?s=42&d=retro&r=g
          createdAt:
            type: string
            format: date-time
            description: Date and time when the change request was created.
            example: '2025-04-30T13:04:48.482Z'
          features:
            type: array
            description: List of feature names affected by this change request.
            items:
              type: string
            example:
            - feature-a
            - feature-b
          segments:
            type: array
            description: List of segment names affected by this change request.
            items:
              type: string
            example:
            - segment-a
            - segment-b
          state:
            type: string
            description: The current state of the change request.
            enum:
