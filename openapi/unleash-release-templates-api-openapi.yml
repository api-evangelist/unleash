openapi: 3.0.3
info:
  title: Unleash Admin Addons Release Templates API
  version: 7.4.1
  description: Create, update, and delete [Unleash addons](https://docs.getunleash.io/addons).
servers:
- url: https://app.unleash-instance.example.com
  description: Your Unleash instance (replace with your actual URL)
security:
- apiKey: []
- bearerToken: []
tags:
- name: Release Templates
  description: API for managing [release templates](https://docs.getunleash.io/concepts/release-templates).
paths:
  /api/admin/release-plan-templates:
    get:
      tags:
      - Release Templates
      operationId: getReleaseTemplates
      summary: Get All Release Templates.
      description: '**Enterprise feature**


        Returns a list of all release templates.'
      responses:
        '200':
          description: '#/components/schemas/releasePlanTemplateSchema'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/releasePlanTemplateSchema'
        '401':
          description: Authorization information is missing or invalid. Provide a valid API token as the `authorization` header, e.g. `authorization:*.*.my-admin-token`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 9c40958a-daac-400e-98fb-3bb438567008
                    description: The ID of the error instance
                  name:
                    type: string
                    example: AuthenticationRequired
                    description: The name of the error kind
                  message:
                    type: string
                    example: You must log in to use Unleash. Your request had no authorization header, so we could not authorize you. Try logging in at /auth/simple/login.
                    description: A description of what went wrong.
    post:
      tags:
      - Release Templates
      operationId: createReleaseTemplate
      summary: Create a Release Template.
      description: '**Enterprise feature**


        Creates and returns a release template.'
      responses:
        '200':
          description: '#/components/schemas/releasePlanTemplateSchema'
