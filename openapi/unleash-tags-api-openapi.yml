components:
  schemas:
    tagSchema:
      type: object
      description: Representation of a [tag](https://docs.getunleash.io/concepts/feature-flags#tags)
      additionalProperties: false
      required:
      - value
      - type
      properties:
        value:
          type: string
          description: The value of the tag.
          minLength: 2
          maxLength: 50
          example: a-tag-value
        type:
          type: string
          minLength: 2
          maxLength: 50
          description: The [type](https://docs.getunleash.io/concepts/feature-flags#tags) of the tag
          example: simple
        color:
          type: string
          description: The hexadecimal color code for the tag type.
          example: '#FFFFFF'
          pattern: ^#[0-9A-Fa-f]{6}$
          nullable: true
    tagTypesSchema:
      type: object
      additionalProperties: false
      required:
      - version
      - tagTypes
      description: A list of tag types with a version number representing the schema used to model the tag types.
      properties:
        version:
          type: integer
          description: The version of the schema used to model the tag types.
          example: 1
        tagTypes:
          type: array
          description: The list of tag types.
          items:
            $ref: '#/components/schemas/tagTypeSchema'
    validateTagTypeSchema:
      type: object
      required:
      - valid
      - tagType
      description: The result of validating a tag type.
      properties:
        valid:
          type: boolean
          description: Whether or not the tag type is valid.
          example: true
        tagType:
          $ref: '#/components/schemas/tagTypeSchema'
    updateTagTypeSchema:
      type: object
      description: The request body for updating a tag type.
      properties:
        description:
          type: string
          description: The description of the tag type.
          example: A tag type for describing the color of a tag.
        icon:
          type: string
          description: The icon of the tag type.
          example: not-really-used
        color:
          type: string
          description: The hexadecimal color code for the tag type.
          example: '#FFFFFF'
          pattern: ^#[0-9A-Fa-f]{6}$
    tagsBulkAddSchema:
      description: Represents tag changes to be applied to a list of features.
      type: object
      additionalProperties: false
      required:
      - features
      - tags
      properties:
        features:
          description: The list of features that will be affected by the tag changes.
          type: array
          items:
            type: string
            minLength: 1
        tags:
          description: The tag changes to be applied to the features.
          $ref: '#/components/schemas/updateTagsSchema'
    createTagSchema:
      type: object
      description: Data used to create a new [tag](https://docs.getunleash.io/concepts/feature-flags#tags)
      additionalProperties: false
      required:
      - value
      - type
      properties:
        value:
          type: string
          pattern: ^\s*\S.{0,48}\S\s*$
          description: The value of the tag. The value must be between 2 and 50 characters long. Leading and trailing whitespace is ignored and will be trimmed before saving the tag value.
          example: a-tag-value
        type:
          type: string
          minLength: 2
          maxLength: 50
          description: The [type](https://docs.getunleash.io/concepts/feature-flags#tags) of the tag
          example: simple
        color:
          type: string
          description: The hexadecimal color code for the tag type.
          example: '#FFFFFF'
          pattern: ^#[0-9A-Fa-f]{6}$
          nullable: true
    updateTagsSchema:
      type: object
      description: Represents a set of changes to a feature's tags, such as adding or removing tags.
      additionalProperties: false
      required:
      - addedTags
      - removedTags
      properties:
        addedTags:
          type: array
          description: Tags to add to the feature.
          items:
            $ref: '#/components/schemas/tagSchema'
        removedTags:
          type: array
          description: Tags to remove from the feature.
          items:
            $ref: '#/components/schemas/tagSchema'
      example:
        addedTags:
        - value: tag-to-add
          type: simple
        removedTags:
        - value: tag-to-remove
          type: simple
    tagTypeSchema:
      type: object
      additionalProperties: false
      description: A tag type.
      required:
      - name
      properties:
        name:
          type: string
          description: The name of the tag type.
          example: color
        description:
          type: string
          description: The description of the tag type.
          example: A tag type for describing the color of a tag.
        icon:
          type: string
          nullable: true
          description: The icon of the tag type.
          example: not-really-used
        color:
          type: string
          nullable: true
          description: The hexadecimal color code for the tag type.
          example: '#FFFFFF'
          pattern: ^#[0-9A-Fa-f]{6}$
    tagsSchema:
      description: A list of tags with a version number
      type: object
      additionalProperties: false
      required:
      - version
      - tags
      properties:
        version:
          type: integer
          description: The version of the schema used to model the tags.
        tags:
          type: array
          description: A list of tags.
          items:
            $ref: '#/components/schemas/tagSchema'
    tagWithVersionSchema:
      type: object
      additionalProperties: false
      required:
      - version
      - tag
      description: A tag with a version number representing the schema used to model the tag.
      properties:
        version:
          type: integer
          description: The version of the schema used to model the tag.
          example: 1
        tag:
          $ref: '#/components/schemas/tagSchema'
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: Authorization
      description: API key needed to access this API
    bearerToken:
      type: http
      scheme: bearer
      description: API key needed to access this API, in Bearer token format
