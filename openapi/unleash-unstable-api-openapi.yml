                properties:
                  id:
                    type: integer
                    description: The ID of the permission
                    example: 1
                  name:
                    type: string
                    description: The name of the permission
                    example: CREATE_FEATURE_STRATEGY
                  displayName:
                    type: string
                    description: The display name of the permission
                    example: Create activation strategies
                  type:
                    type: string
                    description: The type of the permission
                    example: environment
                  environment:
                    type: string
                    nullable: true
                    description: The environment that the permission applies to
                    example: dev
                  hasPermission:
                    type: boolean
                    description: Whether the user has this permission
                    example: true
            environment:
              type: array
              description: The list of environment permissions
              items:
                type: object
                required:
                - id
                - name
                - displayName
                - type
                - hasPermission
                additionalProperties: false
                properties:
                  id:
                    type: integer
                    description: The ID of the permission
                    example: 1
                  name:
                    type: string
                    description: The name of the permission
                    example: CREATE_FEATURE_STRATEGY
                  displayName:
                    type: string
                    description: The display name of the permission
                    example: Create activation strategies
                  type:
                    type: string
                    description: The type of the permission
                    example: environment
                  environment:
                    type: string
                    nullable: true
                    description: The environment that the permission applies to
                    example: dev
                  hasPermission:
                    type: boolean
                    description: Whether the user has this permission
                    example: true
        user:
          description: The user that this access overview is for
