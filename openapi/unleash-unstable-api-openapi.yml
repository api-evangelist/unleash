            properties:
              id:
                type: integer
                description: The role id
                example: 9
                minimum: 0
              type:
                description: A role can either be a global root role (applies to all projects) or a project role
                type: string
                example: root
              name:
                description: The name of the role
                type: string
                example: Editor
              description:
                description: A more detailed description of the role and what use it's intended for
                type: string
                example: Users with the editor role have access to most features in Unleash but can not manage users and roles in the global scope. Editors will be added as project owners when creating projects and get superuser rights within the context of these projects. Users with the editor role will also get access to most permissions on the default project by default.
              project:
                description: What project the role belongs to
                type: string
                nullable: true
                example: default
              permissions:
                type: array
                description: The permissions that this role has
                items:
                  type: object
                  required:
                  - id
                  - name
                  - displayName
                  - type
                  additionalProperties: false
                  properties:
                    id:
                      type: integer
                      description: The ID of the permission
                      example: 1
                    name:
                      type: string
                      description: The name of the permission
                      example: CREATE_FEATURE_STRATEGY
                    displayName:
                      type: string
                      description: The display name of the permission
                      example: Create activation strategies
                    type:
                      type: string
                      description: The type of the permission
                      example: environment
                    environment:
                      type: string
                      nullable: true
                      description: The environment that the permission applies to
                      example: dev
    impactMetricsConfigListSchema:
      type: object
      required:
      - configs
      description: A list of impact metrics configurations for a feature flag.
      additionalProperties: false
      properties:
        configs:
          type: array
          description: The list of impact metrics configurations.
          items:
            $ref: '#/components/schemas/impactMetricsConfigSchema'
    parametersSchema:
      type: object
      description: A list of parameters for a strategy
      additionalProperties:
        type: string
    safeguardTriggerConditionSchema:
      type: object
      required:
      - operator
      - threshold
      additionalProperties: false
      description: The condition that triggers the safeguard.
      properties:
        operator:
          type: string
          enum:
          - '>'
          - <
          description: The comparison operator for the threshold check.
          example: '>'
        threshold:
          type: number
          description: The threshold value to compare against.
          example: 100
    setScimSettingsSchema:
      type: object
      required:
      - enabled
      description: An object describing settings for SCIM provisioning.
      properties:
        enabled:
          type: boolean
          description: Whether SCIM provisioning is currently enabled.
          example: true
    feedbackSchema:
      additionalProperties: false
      description: Schema representing feedback information.
      type: object
      required:
      - id
      - category
      - userType
      - difficultyScore
      - positive
      - areasForImprovement
      - createdAt
      properties:
        id:
          type: number
          example: 123
          description: The unique identifier of the feedback.
        createdAt:
          type: string
          format: date-time
          example: '2022-12-12T12:13:24.218Z'
          description: The date and time when the feedback was provided.
        category:
          type: string
          example: UI/UX
          description: The category of the feedback.
        userType:
          type: string
          nullable: true
          example: developer
          description: The type of user providing the feedback.
        difficultyScore:
          type: number
          nullable: true
          example: 5
          description: A score indicating the difficulty experienced by the user.
        positive:
          type: string
          nullable: true
          example: Easy to navigate.
          description: This field is for users to mention what they liked.
        areasForImprovement:
          nullable: true
          type: string
          example: Slow response time.
          description: Details aspects of the service or product that could benefit from enhancements or modifications. Aids in pinpointing areas needing attention for improvement.
    cdnApiTokenSchema:
      description: The data required to create an CDN API token.
      type: object
      required:
      - tokenName
      - environment
      properties:
        tokenName:
          type: string
          description: The name of the token.
          example: token-64522
        project:
          type: string
          description: The project that the token should be valid for. Defaults to "*" meaning every project.
          example: project-851
        environment:
          type: string
          description: The environment that the token should be valid for.
          example: development
        expiresAt:
          type: string
          format: date-time
          description: The time when this token should expire.
          example: '2023-07-04T11:26:24+02:00'
          nullable: true
    strategyVariantSchema:
      type: object
      additionalProperties: false
      description: This is an experimental property. It may change or be removed as we work on it. Please don't depend on it yet. A strategy variant allows you to attach any data to strategies instead of only returning `true`/`false`. Strategy variants take precedence over feature variants.
      required:
      - name
      - weight
      - weightType
      - stickiness
      properties:
        name:
          type: string
          description: The variant name. Must be unique for this feature flag
          example: blue_group
        weight:
          type: integer
          description: The weight is the likelihood of any one user getting this variant. It is an integer between 0 and 1000. See the section on [variant weights](https://docs.getunleash.io/concepts/feature-flag-variants#variant-weight) for more information
          minimum: 0
          maximum: 1000
        weightType:
          description: Set to `fix` if this variant must have exactly the weight allocated to it. If the type is `variable`, the weight will adjust so that the total weight of all variants adds up to 1000. Refer to the [variant weight documentation](https://docs.getunleash.io/concepts/feature-flag-variants#variant-weight).
          type: string
          example: fix
          enum:
          - variable
          - fix
        stickiness:
          type: string
          description: The [stickiness](https://docs.getunleash.io/concepts/feature-flag-variants#variant-stickiness) to use for distribution of this variant. Stickiness is how Unleash guarantees that the same user gets the same variant every time
          example: custom.context.field
        payload:
          type: object
          required:
          - type
          - value
          description: Extra data configured for this variant
          properties:
            type:
              description: The type of the value. Commonly used types are string, number, json and csv.
              type: string
              enum:
              - json
              - csv
              - string
              - number
            value:
              description: The actual value of payload
              type: string
          example:
            type: json
            value: '{"color": "red"}'
    createSafeguardSchema:
      type: object
      required:
      - impactMetric
      - triggerCondition
      description: Request body to create a safeguard with metric-based alert condition.
      additionalProperties: false
      properties:
        impactMetric:
          type: object
          required:
          - metricName
          - timeRange
          - aggregationMode
          - labelSelectors
          properties:
            metricName:
              type: string
              description: The Prometheus metric series to query. It includes both unleash prefix and metric type and display name
              example: unleash_counter_feature_toggle_usage_total
            timeRange:
              type: string
              enum:
              - hour
              - day
              - week
              - month
              description: The time range for the metric data.
              example: day
            aggregationMode:
              type: string
              description: The aggregation mode for the metric data.
              enum:
              - rps
              - count
              - avg
              - sum
              - p95
              - p99
              - p50
              example: rps
            labelSelectors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
              description: The selected labels and their values for filtering the metric data.
              example:
                environment:
                - development
                project:
                - default
          description: Metric configuration that should be evaluated for the safeguard.
        triggerCondition:
          $ref: '#/components/schemas/safeguardTriggerConditionSchema'
          description: The condition that triggers the safeguard.
    clientFeatureSchema:
      type: object
      required:
      - name
      - enabled
      description: Feature flag configuration used by SDKs to evaluate state of a flag
      additionalProperties: false
      properties:
        name:
          type: string
          description: The unique name of a feature flag. Is validated to be URL safe on creation
          example: new.payment.flow.stripe
        type:
          type: string
          description: What kind of feature flag is this. Refer to the documentation on [feature flag types](https://docs.getunleash.io/concepts/feature-flags#feature-flag-types) for more information
          example: release
        description:
          type: string
          description: A description of the flag
          nullable: true
          example: No variants here
        enabled:
          type: boolean
          description: Whether the feature flag is enabled for the current API key or not. This is ANDed with the evaluation results of the strategies list, so if this is false, the evaluation result will always be false
          example: true
        stale:
          description: If this is true Unleash believes this feature flag has been active longer than Unleash expects a flag of this type to be active
          type: boolean
          example: false
        impressionData:
          description: Set to true if SDKs should trigger [impression events](https://docs.getunleash.io/concepts/impression-data) when this flag is evaluated
          type: boolean
          nullable: true
          example: false
        project:
          description: Which project this feature flag belongs to
          type: string
          example: new.payment.flow
        strategies:
          type: array
          description: Evaluation strategies for this flag. Each entry in this list will be evaluated and ORed together
          items:
            $ref: '#/components/schemas/featureStrategySchema'
        variants:
          type: array
          description: '[Variants](https://docs.getunleash.io/concepts/feature-flag-variants#what-are-variants) configured for this flag'
          items:
            $ref: '#/components/schemas/variantSchema'
          nullable: true
        dependencies:
          type: array
          description: Feature dependencies for this flag
          items:
            $ref: '#/components/schemas/dependentFeatureSchema'
    plausibleMetricsResponseSchema:
      type: object
      required:
      - data
      description: Response containing Plausible analytics data for favorite events.
      additionalProperties: false
      properties:
        data:
          type: array
          description: Array of analytics data points
          items:
            type: object
            required:
            - count
            - date
            additionalProperties: false
            properties:
              count:
                type: number
                description: Number of events for this time period
                example: 1
              date:
                type: string
                description: Date and time of the event (hourly granularity)
                example: '2025-10-15 06:00:00'
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: Authorization
      description: API key needed to access this API
    bearerToken:
      type: http
      scheme: bearer
      description: API key needed to access this API, in Bearer token format
