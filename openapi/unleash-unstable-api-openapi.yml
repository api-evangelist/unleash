      required:
      - sourceMilestone
      - targetMilestone
      - transitionCondition
      description: A milestone progression configuration
      properties:
        sourceMilestone:
          type: string
          description: The ID of the source milestone
          example: milestone-1
        targetMilestone:
          type: string
          description: The ID of the target milestone
          example: milestone-2
        transitionCondition:
          $ref: '#/components/schemas/transitionConditionSchema'
          description: The condition that triggers the transition
    constraintSchema:
      additionalProperties: false
      type: object
      required:
      - contextName
      - operator
      description: A strategy constraint. For more information, refer to [the strategy constraint reference documentation](https://docs.getunleash.io/concepts/activation-strategies#constraints)
      properties:
        contextName:
          description: The name of the context field that this constraint should apply to.
          example: appName
          type: string
        operator:
          description: The operator to use when evaluating this constraint. For more information about the various operators, refer to [the strategy constraint operator documentation](https://docs.getunleash.io/concepts/activation-strategies#constraint-operators).
          type: string
          enum:
          - NOT_IN
          - IN
          - STR_ENDS_WITH
          - STR_STARTS_WITH
          - STR_CONTAINS
          - NUM_EQ
          - NUM_GT
          - NUM_GTE
          - NUM_LT
          - NUM_LTE
          - DATE_AFTER
          - DATE_BEFORE
          - SEMVER_EQ
          - SEMVER_GT
          - SEMVER_LT
          example: IN
        caseInsensitive:
          description: Whether the operator should be case sensitive or not. Defaults to `false` (being case sensitive).
          type: boolean
          default: false
        inverted:
          description: Whether the result should be negated or not. If `true`, will turn a `true` result into a `false` result and vice versa.
          type: boolean
          default: false
        values:
          type: array
          description: The context values that should be used for constraint evaluation. Use this property instead of `value` for properties that accept multiple values.
          items:
            type: string
          example:
          - my-app
          - my-other-app
        value:
          description: The context value that should be used for constraint evaluation. Use this property instead of `values` for properties that only accept single values.
          type: string
          example: my-app
    featureLinkSchema:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          example: https://github.com/search?q=cleanupReminder&type=code
          description: The URL the feature is linked to
        title:
          type: string
          example: Github cleanup
          description: The description of the link
          nullable: true
      description: The link to any URL related to the feature
    personalDashboardSchema:
      type: object
      description: Project and flags relevant to the user
      additionalProperties: false
      required:
      - projects
      - flags
      - admins
      - projectOwners
      properties:
        admins:
          type: array
          description: Users with the admin role in Unleash.
          items:
            type: object
            required:
            - id
            properties:
              id:
                type: integer
                description: The user ID.
                example: 1
              name:
                type: string
                description: The user's name.
                example: Ash Ketchum
              username:
                type: string
                description: The user's username.
                example: pokémaster13
              imageUrl:
                type: string
                example: https://example.com/peek-at-you.jpg
              email:
                type: string
                example: user@example.com
        projectOwners:
          type: array
          description: Users with the project owner role in Unleash. Only contains owners of projects that are visible to the user.
          items:
            type: object
            required:
            - ownerType
            - name
            properties:
              ownerType:
                type: string
                enum:
                - user
                description: The type of the owner; will always be `user`.
              name:
                type: string
                example: User Name
                description: The name displayed for the user. Can be the user's name, username, or email, depending on what they have provided.
              imageUrl:
                type: string
                nullable: true
                description: The URL of the user's profile image.
                example: https://example.com/image.jpg
              email:
                type: string
                nullable: true
                description: The user's email address.
                example: user@example.com
        projects:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - name
            - health
            - technicalDebt
            - memberCount
            - featureCount
            properties:
              id:
                type: string
                example: my-project-id
                description: The id of the project
              name:
                type: string
                example: My Project
                description: The name of the project
              health:
                type: integer
                example: 50
                minimum: 0
                deprecated: true
                description: Use `technicalDebt` instead.
              technicalDebt:
                type: integer
                example: 25
                minimum: 0
                maximum: 100
                description: An indicator of the [project's technical debt](https://docs.getunleash.io/concepts/technical-debt#project-status) on a scale from 0 to 100
              memberCount:
                type: integer
                example: 4
                minimum: 0
                description: The number of members this project has
              featureCount:
                type: integer
                example: 10
                minimum: 0
                description: The number of features this project has
          description: A list of projects that a user participates in with any role e.g. member or owner or any custom role
        flags:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - project
            - type
            properties:
              name:
                type: string
                example: my-flag
                description: The name of the flag
              project:
                type: string
                example: my-project-id
                description: The id of the feature project
              type:
                type: string
                example: release
                description: The type of the feature flag
          description: A list of flags a user created or favorited
    featureStrategySchema:
      description: A single activation strategy configuration schema for a feature
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        id:
          type: string
          description: A uuid for the feature strategy
          example: 6b5157cb-343a-41e7-bfa3-7b4ec3044840
        name:
          type: string
          description: The name or type of strategy
          example: flexibleRollout
        title:
          type: string
          description: A descriptive title for the strategy
          example: Gradual Rollout 25-Prod
          nullable: true
        disabled:
          type: boolean
          description: A toggle to disable the strategy. defaults to false. Disabled strategies are not evaluated or returned to the SDKs
          example: false
          nullable: true
        featureName:
          type: string
          description: The name or feature the strategy is attached to
          example: myAwesomeFeature
        sortOrder:
          type: number
          description: The order of the strategy in the list
          example: 9999
        segments:
          type: array
          description: A list of segment ids attached to the strategy
          example:
          - 1
          - 2
          items:
            type: number
        constraints:
          type: array
          description: A list of the constraints attached to the strategy. See https://docs.getunleash.io/concepts/activation-strategies#constraints
          items:
            $ref: '#/components/schemas/constraintSchema'
        variants:
          type: array
          description: Strategy level variants
          items:
            $ref: '#/components/schemas/strategyVariantSchema'
        parameters:
          $ref: '#/components/schemas/parametersSchema'
    projectActivitySchema:
      type: array
      description: An array of project activity information. Each item contains a date and the total number of activities for that date.
      items:
        type: object
        additionalProperties: false
        required:
        - date
        - count
        properties:
          date:
            type: string
            example: '2022-12-14'
            description: Activity date
          count:
            type: integer
            minimum: 0
            description: Activity count
    licensedUsersSchema:
      description: A response model representing user license data.
      type: object
      additionalProperties: false
      required:
      - licensedUsers
      - seatCount
      properties:
        seatCount:
          type: integer
          minimum: 0
          example: 25
          description: The total number of licensed seats currently available for this Unleash instance.
        licensedUsers:
          type: object
          required:
          - history
          - current
          description: An object containing historical and current licensed user data.
          properties:
            history:
              type: array
              description: A monthly history of licensed user counts.
              items:
                $ref: '#/components/schemas/licensedUserSchema'
            current:
              description: The current number of licenses in use.
              type: integer
              minimum: 0
              example: 25
    scimTokenSchema:
      type: object
      required:
      - token
      description: An object describing a SCIM provisioning API token.
      additionalProperties: false
      properties:
        token:
          type: string
          description: The token used for SCIM API authentication. Can be revoked at a later stage by generating a new one.
          example: xyzrandomstring
    featureLifecycleCompletedSchema:
      description: A feature that has been marked as completed
      additionalProperties: false
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - kept
          - discarded
          example: kept
          description: The status of the feature after it has been marked as completed
        statusValue:
          type: string
          example: variant1
          description: The metadata value passed in together with status
    changeMilestoneProgressionSchema:
      type: object
      additionalProperties: true
      required:
      - targetMilestone
      - transitionCondition
      description: Request body to create or update a milestone progression
      properties:
        targetMilestone:
          type: string
          description: The ID of the target milestone
          example: 11K7NXD655W7R89659K58RE07B
        transitionCondition:
          $ref: '#/components/schemas/transitionConditionSchema'
          description: The condition configuration for the transition
    userSchema:
      type: object
      additionalProperties: false
      description: An Unleash user
      required:
      - id
      properties:
        id:
          description: The user id
          type: integer
          example: 123
        name:
          description: Name of the user
          type: string
          example: User
          nullable: true
        email:
          description: Email of the user
          type: string
          example: user@example.com
        username:
          description: A unique username for the user
          type: string
          example: hunter
          nullable: true
        imageUrl:
          description: URL used for the user profile image
          type: string
          example: https://example.com/242x200.png
        inviteLink:
          description: If the user is actively inviting other users, this is the link that can be shared with other users
          type: string
          example: http://localhost:4242/invite-link/some-secret
        loginAttempts:
          description: How many unsuccessful attempts at logging in has the user made
          type: integer
          minimum: 0
          example: 3
        emailSent:
          description: Is the welcome email sent to the user or not
          type: boolean
          example: false
        rootRole:
          description: Which [root role](https://docs.getunleash.io/concepts/rbac#predefined-roles) this user is assigned
          type: integer
          example: 1
          minimum: 0
        seenAt:
          description: The last time this user logged in
          type: string
          format: date-time
          nullable: true
          example: '2023-06-30T11:42:00.345Z'
        createdAt:
          description: The user was created at this time
          type: string
          format: date-time
          example: '2023-06-30T11:41:00.123Z'
        accountType:
          description: A user is either an actual User or a Service Account
          type: string
          enum:
          - User
          - Service Account
          example: User
        permissions:
          description: Deprecated
          type: array
          items:
            type: string
        scimId:
          description: The SCIM ID of the user, only present if managed by SCIM
          type: string
          nullable: true
          example: 01HTMEXAMPLESCIMID7SWWGHN6
        seatType:
          description: The seat type of this user
          type: string
          nullable: true
          example: Regular
        activeSessions:
          description: Count of active browser sessions for this user
          type: integer
          nullable: true
          example: 2
        deletedSessions:
          description: Experimental. The number of deleted browser sessions after last login
          type: number
          example: 1
    meteredConnectionsSchema:
      type: object
      description: Contains the recorded metered groups connections segmented by day/month
      required:
      - dateRange
      - apiData
      - grouping
      additionalProperties: false
      properties:
        grouping:
          type: string
          enum:
          - monthly
          - daily
          description: Whether the data is aggregated by month or by day.
          example: monthly
        dateRange:
          type: object
          required:
          - from
          - to
          additionalProperties: false
          description: The date range there is data for. The range is inclusive and goes from the start of the `from` date to the end of the `to` date
          properties:
            from:
              type: string
              format: date
              example: '2023-04-01'
              description: The start of the dateRange
            to:
              type: string
              format: date
              example: '2023-04-30'
              description: The end of the dateRange
        apiData:
          type: array
          description: Contains the recorded daily/monthly connections for each metered group
          items:
            type: object
            required:
            - meteredGroup
            - dataPoints
            additionalProperties: false
            properties:
              meteredGroup:
                type: string
                example: default
                description: The metered group representing charging unit in the organization using Unleash
              dataPoints:
                type: array
                description: The recorded data points for the metered group
                items:
                  type: object
                  required:
                  - period
                  - connections
                  additionalProperties: false
                  properties:
                    period:
                      type: string
                      pattern: ^\d{4}-\d{2}(-\d{2})?$
                      example: '2023-04-01'
                      description: The date of the data point. Formatted as a full date (e.g. 2023-04-01) if the data is aggregated by day or as a month (e.g. 2023-04) if the data is aggregated by month.
                    connections:
                      type: number
                      minimum: 0
                      example: 10.5
                      description: Number of connections. 1 connection = 7200 backend SDK requests per day
    variantSchema:
      type: object
      additionalProperties: false
      description: A variant allows for further separation of users into segments. See [our excellent documentation](https://docs.getunleash.io/concepts/feature-flag-variants#what-are-variants) for a more detailed description
      required:
      - name
      - weight
      properties:
        name:
          type: string
          description: The variants name. Is unique for this feature flag
          example: blue_group
        weight:
          type: number
          description: The weight is the likelihood of any one user getting this variant. It is a number between 0 and 1000. See the section on [variant weights](https://docs.getunleash.io/concepts/feature-flag-variants#variant-weight) for more information
          minimum: 0
          maximum: 1000
        weightType:
          description: Set to fix if this variant must have exactly the weight allocated to it. If the type is variable, the weight will adjust so that the total weight of all variants adds up to 1000
          type: string
          example: variable
          enum:
          - variable
          - fix
        stickiness:
          type: string
          description: '[Stickiness](https://docs.getunleash.io/concepts/feature-flag-variants#variant-stickiness) is how Unleash guarantees that the same user gets the same variant every time'
          example: custom.context.field
        payload:
          type: object
          required:
          - type
          - value
          description: Extra data configured for this variant
          additionalProperties: false
          properties:
            type:
              description: The type of the value. Commonly used types are string, number, json and csv.
              type: string
              enum:
              - json
              - csv
              - string
              - number
            value:
              description: The actual value of payload
              type: string
          example:
            type: json
            value: '{"color": "red"}'
        overrides:
          description: Overrides assigning specific variants to specific users. The weighting system automatically assigns users to specific groups for you, but any overrides in this list will take precedence.
          type: array
          items:
            $ref: '#/components/schemas/overrideSchema'
    featureLifecycleCountSchema:
      type: object
      description: A number features in each of the lifecycle stages
      required:
      - initial
      - preLive
      - live
      - completed
      - archived
      additionalProperties: false
      properties:
        initial:
          type: number
          example: 1
          description: Number of features in the initial stage
        preLive:
          type: number
          example: 1
          description: Number of features in the pre-live stage
        live:
          type: number
          example: 1
          description: Number of features in the live stage
        completed:
          type: number
          example: 1
          description: Number of features in the completed stage
        archived:
          type: number
          example: 1
          description: Number of features in the archived stage
    overrideSchema:
      type: object
      additionalProperties: false
      required:
      - contextName
      - values
      description: An override for deciding which variant should be assigned to a user based on the context name
      properties:
        contextName:
          description: The name of the context field used to determine overrides
          type: string
          example: userId
        values:
          description: Which values that should be overriden
          type: array
          items:
            type: string
          example:
          - red
          - blue
    clientSegmentSchema:
      type: object
      description: Represents a client API segment of users defined by a set of constraints.
      additionalProperties: false
      required:
      - id
      - constraints
      properties:
        id:
          type: number
          description: The segment's id.
        name:
          type: string
          description: The name of the segment.
          example: segment A
        constraints:
          type: array
          description: List of constraints that determine which users are part of the segment
          items:
            $ref: '#/components/schemas/constraintSchema'
    projectStatusSchema:
      type: object
      additionalProperties: false
      required:
      - activityCountByDate
      - resources
      - health
      - technicalDebt
      - lifecycleSummary
      - staleFlags
      description: Schema representing the overall status of a project, including an array of activity records. Each record in the activity array contains a date and a count, providing a snapshot of the project’s activity level over time.
      properties:
        activityCountByDate:
          $ref: '#/components/schemas/projectActivitySchema'
          description: Array of activity records with date and count, representing the project’s daily activity statistics.
        health:
          type: object
          additionalProperties: false
          required:
          - current
          description: Information about the project's health rating
          properties:
            current:
              type: integer
              minimum: 0
              description: The project's current health score, based on the ratio of healthy flags to stale and potentially stale flags.
              example: 100
        technicalDebt:
          type: object
          additionalProperties: false
          required:
          - current
          description: Information about the project's health rating
          properties:
            current:
              type: integer
              minimum: 0
              maximum: 100
              description: The project's current health score, based on the ratio of healthy flags to stale and potentially stale flags.
              example: 100
        resources:
          type: object
          additionalProperties: false
          required:
          - apiTokens
          - members
          - segments
          description: Key resources within the project
          properties:
            apiTokens:
              type: integer
              minimum: 0
              description: The number of API tokens created specifically for this project.
            members:
              type: integer
              minimum: 0
              description: The number of users who have been granted roles in this project. Does not include users who have access via groups.
            segments:
              type: integer
              minimum: 0
              description: The number of segments that are scoped to this project.
        staleFlags:
          type: object
          additionalProperties: false
          description: Information on stale and potentially stale flags in this project.
          required:
          - total
          properties:
            total:
              type: integer
              minimum: 0
              description: The total number of flags in this project that are stale or potentially stale.
        lifecycleSummary:
          type: object
          additionalProperties: false
          description: Feature flag lifecycle statistics for this project.
          required:
          - initial
          - preLive
          - live
          - completed
          - archived
          properties:
            initial:
              type: object
              additionalProperties: false
              description: Statistics on feature flags in a given stage in this project.
              required:
              - averageDays
              - currentFlags
              properties:
                averageDays:
                  type: number
                  nullable: true
                  description: The average number of days a feature flag remains in a stage in this project. Will be null if Unleash doesn't have any data for this stage yet.
                  example: 5
                currentFlags:
                  type: integer
                  description: The number of feature flags currently in a stage in this project.
                  example: 10
            preLive:
              type: object
              additionalProperties: false
              description: Statistics on feature flags in a given stage in this project.
              required:
              - averageDays
              - currentFlags
              properties:
                averageDays:
                  type: number
                  nullable: true
                  description: The average number of days a feature flag remains in a stage in this project. Will be null if Unleash doesn't have any data for this stage yet.
                  example: 5
                currentFlags:
                  type: integer
                  description: The number of feature flags currently in a stage in this project.
                  example: 10
            live:
              type: object
              additionalProperties: false
              description: Statistics on feature flags in a given stage in this project.
              required:
              - averageDays
              - currentFlags
              properties:
                averageDays:
                  type: number
                  nullable: true
                  description: The average number of days a feature flag remains in a stage in this project. Will be null if Unleash doesn't have any data for this stage yet.
                  example: 5
                currentFlags:
                  type: integer
                  description: The number of feature flags currently in a stage in this project.
                  example: 10
            completed:
              type: object
              additionalProperties: false
              description: Statistics on feature flags in a given stage in this project.
              required:
              - averageDays
              - currentFlags
              properties:
                averageDays:
                  type: number
                  nullable: true
                  description: The average number of days a feature flag remains in a stage in this project. Will be null if Unleash doesn't have any data for this stage yet.
                  example: 5
                currentFlags:
                  type: integer
                  description: The number of feature flags currently in a stage in this project.
                  example: 10
            archived:
              type: object
              additionalProperties: false
              required:
              - currentFlags
              - last30Days
              description: Information on archived flags in this project.
              properties:
                currentFlags:
                  type: integer
                  description: The number of archived feature flags in this project. If a flag is deleted permanently, it will no longer be counted as part of this statistic.
                  example: 10
                last30Days:
                  type: integer
                  description: The number of flags in this project that have been changed over the last 30 days.
                  example: 5
    feedbackListSchema:
      type: array
      description: A list of feedback items.
      items:
        $ref: '#/components/schemas/feedbackSchema'
    featureLifecycleSchema:
      type: array
      description: A list of lifecycle stages for a given feature
      items:
        additionalProperties: false
        type: object
        required:
        - stage
        - enteredStageAt
        properties:
          stage:
            type: string
            enum:
            - initial
            - pre-live
            - live
            - completed
            - archived
            example: initial
            description: The name of the lifecycle stage that got recorded for a given feature
          status:
            type: string
            example: kept
            description: The name of the detailed status of a given stage. E.g. completed stage can be kept or discarded.
          enteredStageAt:
            type: string
            format: date-time
            example: '2023-01-28T16:21:39.975Z'
            description: The date when the feature entered a given stage
        description: The lifecycle stage of the feature
    createImpactMetricsConfigSchema:
      type: object
      required:
      - metricName
      - timeRange
      - yAxisMin
      - aggregationMode
      - labelSelectors
      description: Describes the configuration for a single impact metric chart.
      additionalProperties: true
      properties:
        id:
          type: string
          description: The unique ULID identifier for this impact metric configuration. Generated automatically if not provided.
          example: 01ARZ3NDEKTSV4RRFFQ69G5FAV
        metricName:
          type: string
          description: The Prometheus metric series to query. It includes both unleash prefix and metric type and display name
          example: unleash_counter_feature_toggle_usage_total
        timeRange:
          type: string
          enum:
          - hour
          - day
          - week
          - month
          description: The time range for the metric data.
          example: day
        yAxisMin:
          type: string
          enum:
          - auto
          - zero
          description: Whether the chart should begin at zero on the y-axis.
          example: auto
        aggregationMode:
          type: string
          description: The aggregation mode for the metric data.
          enum:
          - rps
          - count
          - avg
          - sum
          - p95
          - p99
          - p50
          example: rps
        labelSelectors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: The selected labels and their values for filtering the metric data.
          example:
            environment:
            - development
            project:
            - default
        title:
          type: string
          description: Optional title for the impact metric chart.
          example: Feature Toggle Usage
          nullable: false
    instanceInsightsSchema:
      additionalProperties: false
      description: A summary of this Unleash instance's usage statistics, including user and flag counts, and trends over time.
      type: object
      required:
      - userTrends
      - flagTrends
      - projectFlagTrends
      - metricsSummaryTrends
      - environmentTypeTrends
      - lifecycleTrends
      - creationArchiveTrends
      properties:
        userTrends:
          type: array
          description: How number of users changed over time
          items:
            type: object
            additionalProperties: false
            required:
            - date
            - total
            - active
            - inactive
            properties:
              date:
                type: string
                format: date-time
                example: '2024-01-12T23:59:59.999Z'
                description: A UTC date when the stats were captured. Time is the very end of a given day.
              total:
                type: number
                example: 100
                description: The number of actual Unleash users on a particular day
              active:
                type: number
                example: 98
                description: The number of active Unleash users on a particular day
              inactive:
                type: number
                example: 2
                description: The number of inactive Unleash users on a particular day
        flagTrends:
          type: array
          description: How number of flags changed over time
          items:
            type: object
            additionalProperties: false
            required:
            - date
            - total
            - active
            - stale
            - potentiallyStale
            properties:
              date:
                type: string
                format: date-time
                example: '2024-01-12T23:59:59.999Z'
                description: A UTC date when the stats were captured. Time is the very end of a given day.
              total:
                type: number
                example: 100
                description: The number of all flags on a particular day
              active:
                type: number
                example: 98
                description: The number of active flags on a particular day
              stale:
                type: number
                example: 0
                description: The number of user marked stale flags on a particular day
              potentiallyStale:
                type: number
                example: 2
                description: The number of time calculated potentially stale flags on a particular day
        projectFlagTrends:
          type: array
          description: How number of flags per project changed over time
          items:
            type: object
            additionalProperties: false
            required:
            - project
            - date
            - total
            - active
            - stale
            - potentiallyStale
            - week
            - health
            properties:
              week:
                type: string
                example: 2024-40
                description: Year and week in a given year for which the stats were calculated
              project:
                type: string
                example: default
                description: Project id of the project the flag trends belong to
              health:
                type: number
                example: 50
                deprecated: true
                description: Use `technicalDebt` instead.
              technicalDebt:
                type: number
                example: 20
                minimum: 0
                maximum: 100
                description: An indicator of the [project's technical debt](https://docs.getunleash.io/concepts/technical-debt) on a scale from 0 to 100
              timeToProduction:
                type: number
                example: 10
                description: The average time from when a feature was created to when it was enabled in the "production" environment during the current window
              date:
                type: string
                format: date-time
                example: '2024-01-12T23:59:59.999Z'
                description: A UTC date when the stats were captured. Time is the very end of a given day.
              total:
                type: number
                example: 100
                description: The number of all flags on a particular day
              active:
                type: number
                example: 98
                description: The number of active flags on a particular day
              stale:
                type: number
                example: 0
                description: The number of user marked stale flags on a particular day
              potentiallyStale:
                type: number
                example: 2
                description: The number of time calculated potentially stale flags on a particular day
              users:
                type: number
                example: 30
                description: The number of users who have access to the project
        metricsSummaryTrends:
          type: array
          description: How metrics data per project changed over time
          items:
            type: object
            additionalProperties: false
            required:
            - week
            - date
            - project
            - totalRequests
            - totalYes
            - totalNo
            - totalApps
            - totalFlags
            - totalEnvironments
            properties:
              week:
                type: string
                example: 2024-01
                description: Year and week in a given year for which the metrics summary was calculated
              date:
                type: string
                format: date-time
                example: '2024-01-12T23:59:59.999Z'
                description: A UTC date when metrics summary was captured. Time is the very end of a given day.
              project:
                type: string
                example: default
                description: Project id of the project the impressions summary belong to
              totalRequests:
                type: number
                example: 50
                description: 'Total number of times all project flags were requested '
              totalYes:
                type: number
                example: 50
                description: Total number of times all project flags were exposed across all environments
              totalNo:
                type: number
                example: 50
                description: Total number of times all project flags were not exposed across all environments
              totalApps:
                type: number
                example: 50
                description: Total number of applications the impression data belong to
              totalFlags:
                type: number
                example: 50
                description: Total number of flags the impression data belong to
              totalEnvironments:
                type: number
                example: 50
                description: Total number of environments the impression data belong to
        environmentTypeTrends:
          type: array
          description: How updates per environment type changed over time
          items:
            type: object
            additionalProperties: false
            required:
            - date
            - week
            - environmentType
            - totalUpdates
            properties:
              date:
                type: string
                format: date-time
                example: '2024-01-12T23:59:59.999Z'
                description: A UTC date when the stats were captured. Time is the very end of a given day.
              week:
                type: string
                example: 2024-01
                description: Year and week in a given year for which the stats were calculated
              environmentType:
                type: string
                example: production
                description: Environment type the data belongs too
              totalUpdates:
                type: number
                example: 50
                description: 'Total number of times configuration has been updated in the environment type '
        lifecycleTrends:
          type: array
          description: Weekly count of new flags entering production
          items:
            type: object
            additionalProperties: false
            required:
            - week
            - date
            - newProductionFlags
            - project
            properties:
              week:
                type: string
                example: 2024-15
                description: Year and week in a given year for which the stats were calculated
              date:
                type: string
                format: date-time
                example: '2024-04-12T23:59:59.999Z'
                description: A UTC date when the stats were captured. Time is the very end of a given week.
              newProductionFlags:
                type: number
                example: 5
                description: Number of flags that entered production during this week
              project:
                type: string
                example: default
                description: Project id that the flags belong to
        creationArchiveTrends:
          type: array
          description: Weekly count of created vs archived flags by project and flag type
          items:
            type: object
            additionalProperties: false
            required:
            - week
            - date
            - project
            - createdFlags
            - archivedFlags
            properties:
              week:
                type: string
                example: 2024-15
                description: Year and week in a given year for which the stats were calculated
              date:
                type: string
                format: date-time
                example: '2024-04-12T23:59:59.999Z'
                description: A UTC date when the stats were captured. Time is the very end of a given week.
              project:
                type: string
                example: default
                description: Project id that the flags belong to
              createdFlags:
                type: object
                description: Count of newly created flags by flag type
                additionalProperties:
                  type: number
                  minimum: 0
                example:
                  experiment: 5
                  release: 2
                  operational: 1
              archivedFlags:
                type: number
                example: 3
                minimum: 0
                description: Total count of archived flags during this week
    actionableChangeRequestsSchema:
      type: object
      description: Data related to actionable change requests in a project.
      required:
      - total
      properties:
        total:
          type: integer
          minimum: 0
          description: The number of actionable change requests in the project.
    cdnApiTokensSchema:
      description: List of CDN tokens.
      type: object
      properties:
        tokens:
          type: array
          description: List of tokens for CDN
          items:
            $ref: '#/components/schemas/cdnApiTokenSchema'
    dependentFeatureSchema:
      type: object
      description: Feature dependency on a parent feature in read model
      required:
      - feature
      additionalProperties: false
      properties:
        feature:
          type: string
          description: The name of the feature we depend on.
          example: parent_feature
        enabled:
          type: boolean
          description: Whether the parent feature should be enabled. When `false` variants are ignored. `true` by default.
          example: false
        variants:
          type: array
          description: The list of variants the parent feature should resolve to. Leave empty when you only want to check the `enabled` status.
          items:
            type: string
          example:
          - variantA
          - variantB
    provideFeedbackSchema:
      additionalProperties: false
      description: Schema representing the creation of feedback information.
      type: object
      required:
      - category
      properties:
        category:
          type: string
          example: UI/UX
          description: The category of the feedback.
        userType:
          type: string
          nullable: true
          example: developer
          description: The type of user providing the feedback.
        difficultyScore:
          type: number
          nullable: true
          example: 5
          description: A score indicating the difficulty experienced by the user.
        positive:
          type: string
          nullable: true
          example: Easy to navigate.
          description: This field is for users to mention what they liked.
        areasForImprovement:
          nullable: true
          type: string
          example: Slow response time.
          description: Details aspects of the service or product that could benefit from enhancements or modifications. Aids in pinpointing areas needing attention for improvement.
    scimSettingsSchema:
      type: object
      required:
      - enabled
      - hasToken
      description: An object describing settings for SCIM provisioning.
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: Whether SCIM provisioning is currently enabled.
          example: true
        hasToken:
          type: boolean
          description: Whether a SCIM provisioning API token is currently set.
          example: true
    clientFeaturesDeltaSchema:
      type: object
      required:
      - events
      description: Schema for delta updates of feature configurations.
      properties:
        events:
          description: A list of delta events.
          type: array
          items:
            type: object
            anyOf:
            - type: object
              required:
              - eventId
              - type
              - feature
              properties:
                eventId:
                  type: number
                type:
                  type: string
                  enum:
                  - feature-updated
                feature:
                  $ref: '#/components/schemas/clientFeatureSchema'
            - type: object
              required:
              - eventId
              - type
              - featureName
              - project
              properties:
                eventId:
                  type: number
                type:
                  type: string
                  enum:
                  - feature-removed
                featureName:
                  type: string
                project:
                  type: string
            - type: object
              required:
              - eventId
              - type
              - segment
              properties:
                eventId:
                  type: number
                type:
                  type: string
                  enum:
                  - segment-updated
                segment:
                  $ref: '#/components/schemas/clientSegmentSchema'
            - type: object
              required:
              - eventId
              - type
              - segmentId
              properties:
                eventId:
                  type: number
                type:
                  type: string
                  enum:
                  - segment-removed
                segmentId:
                  type: number
            - type: object
              required:
              - type
              - features
              - segments
              - eventId
              properties:
                eventId:
                  type: number
                type:
                  type: string
                  enum:
                  - hydration
                features:
                  type: array
                  items:
                    $ref: '#/components/schemas/clientFeatureSchema'
                segments:
                  type: array
                  items:
                    $ref: '#/components/schemas/clientSegmentSchema'
    edgeLicenseStateSchema:
      description: A model representing the Edge license state response.
      type: object
      additionalProperties: false
      required:
      - edgeLicenseState
      properties:
        edgeLicenseState:
          description: State of the current Enterprise Edge license
          type: string
          enum:
          - Valid
          - Invalid
          - Expired
    licensedUserSchema:
      description: A schema representing a single licensed user data point.
      type: object
      additionalProperties: false
      required:
      - date
      - count
      properties:
        date:
          type: string
          format: date-time
          description: The date associated with the licensed users count.
          example: '2024-10-01T00:00:00.000Z'
        count:
          type: integer
          description: The count of licensed users on the given date.
          minimum: 0
          example: 100
    impactMetricsConfigSchema:
      type: object
      required:
      - metricName
      - timeRange
      - yAxisMin
      - aggregationMode
      - labelSelectors
      - type
      - displayName
      - id
      description: Describes the configuration for a single impact metric chart.
      additionalProperties: false
      properties:
        id:
          type: string
          description: The unique ULID identifier for this impact metric configuration. Generated automatically if not provided.
          example: 01ARZ3NDEKTSV4RRFFQ69G5FAV
        metricName:
          type: string
          description: The Prometheus metric series to query. It includes both unleash prefix and metric type and display name
          example: unleash_counter_feature_toggle_usage_total
        timeRange:
          type: string
          enum:
          - hour
          - day
          - week
          - month
          description: The time range for the metric data.
          example: day
        aggregationMode:
          type: string
          description: The aggregation mode for the metric data.
          enum:
          - rps
          - count
          - avg
          - sum
          - p95
          - p99
          - p50
          example: rps
        labelSelectors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: The selected labels and their values for filtering the metric data.
          example:
            environment:
            - development
            project:
            - default
        type:
          type: string
          description: The type of metric
          enum:
          - counter
          - gauge
          - histogram
          - unknown
          example: counter
        displayName:
          type: string
          description: The human readable display name of the impact metric
          example: feature_toggle_usage_total
        yAxisMin:
          type: string
          enum:
          - auto
          - zero
          description: Whether the chart should begin at zero on the y-axis.
          example: auto
        step:
          type: string
          enum:
          - 1m
          - 15m
          - 3h
          - 1d
          description: The step interval for querying metrics data. This is automatically calculated from the timeRange and stored when the metric is created or updated.
          example: 15m
          nullable: true
        title:
          type: string
          description: Optional title for the impact metric chart.
          example: Feature Toggle Usage
          nullable: false
        mode:
          type: string
          enum:
          - read
          - write
          description: 'The access mode for this impact metric configuration: "read" when referenced by a safeguard, "write" otherwise.'
          example: write
    transitionConditionSchema:
      type: object
      additionalProperties: false
      required:
      - intervalMinutes
      description: A transition condition for milestone progression
      properties:
        intervalMinutes:
          type: integer
          minimum: 1
          description: The interval in minutes before transitioning
          example: 30
    meteredRequestsSchema:
      type: object
      description: Contains the recorded metered groups requests segmented by day/month
      required:
      - dateRange
      - apiData
      - grouping
      additionalProperties: false
      properties:
        grouping:
          type: string
          enum:
          - monthly
          - daily
          description: Whether the data is aggregated by month or by day.
          example: monthly
        dateRange:
          type: object
          required:
          - from
          - to
          additionalProperties: false
          description: The date range there is data for. The range is inclusive and goes from the start of the `from` date to the end of the `to` date
          properties:
            from:
              type: string
              format: date
              example: '2023-04-01'
              description: The start of the dateRange
            to:
              type: string
              format: date
              example: '2023-04-30'
              description: The end of the dateRange
        apiData:
          type: array
          description: Contains the recorded daily/monthly requests for each metered group
          items:
            type: object
            required:
            - meteredGroup
            - dataPoints
            additionalProperties: false
            properties:
              meteredGroup:
                type: string
                example: default
                description: The metered group representing charging unit in the organization using Unleash
              dataPoints:
                type: array
                description: The recorded data points for the metered group
                items:
                  type: object
                  required:
                  - period
                  - requests
                  additionalProperties: false
                  properties:
                    period:
                      type: string
                      pattern: ^\d{4}-\d{2}(-\d{2})?$
                      example: '2023-04-01'
                      description: The date of the data point. Formatted as a full date (e.g. 2023-04-01) if the data is aggregated by day or as a month (e.g. 2023-04) if the data is aggregated by month.
                    requests:
                      type: number
                      minimum: 0
                      example: 1200
                      description: Number of requests
    personalDashboardProjectDetailsSchema:
      type: object
      description: Project details in personal dashboard
      additionalProperties: false
      required:
      - owners
      - roles
      - latestEvents
      - onboardingStatus
      - insights
      properties:
        insights:
          type: object
          description: Insights for the project, including flag data and project health information.
          additionalProperties: false
          required:
          - avgHealthCurrentWindow
          - avgHealthPastWindow
          - totalFlags
          - activeFlags
          - staleFlags
          - potentiallyStaleFlags
          - health
          - technicalDebt
          properties:
            avgHealthCurrentWindow:
              type: integer
              minimum: 0
              description: The project's average health score over the last 4 weeks
              example: 80
              nullable: true
            avgHealthPastWindow:
              type: integer
              minimum: 0
              description: The project's average health score over the previous 4-week window
              example: 70
              nullable: true
            totalFlags:
              type: integer
              minimum: 0
              example: 100
              description: The current number of non-archived flags
            activeFlags:
              type: integer
              minimum: 0
              example: 98
              description: The number of active flags that are not stale or potentially stale
            staleFlags:
              type: integer
              minimum: 0
              example: 0
              description: The current number of flags that have been manually marked as stale
            potentiallyStaleFlags:
              type: integer
              minimum: 0
              example: 2
              description: The number of potentially stale flags as calculated by Unleash
            health:
              type: integer
              minimum: 0
              description: Use `technicalDebt` instead.
              example: 80
              deprecated: true
            technicalDebt:
              type: integer
              example: 25
              minimum: 0
              maximum: 100
              description: An indicator of the [project's technical debt](https://docs.getunleash.io/concepts/technical-debt#project-status) on a scale from 0 to 100
        onboardingStatus:
          type: object
          oneOf:
          - type: object
            properties:
              status:
                type: string
                enum:
                - onboarding-started
                - onboarded
                example: onboarding-started
            required:
            - status
            additionalProperties: false
          - type: object
            properties:
              status:
                type: string
                enum:
                - first-flag-created
                example: first-flag-created
              feature:
                type: string
                description: The name of the feature flag
                example: my-feature-flag
            required:
            - status
            - feature
            additionalProperties: false
          description: The current onboarding status of the project.
        latestEvents:
          type: array
          description: The latest events for the project.
          items:
            type: object
            description: An event summary
            additionalProperties: false
            required:
            - summary
            - createdBy
            - createdByImageUrl
            - id
            - createdAt
            properties:
              id:
                type: integer
                minimum: 1
                description: The ID of the event.
              summary:
                type: string
                nullable: true
                description: '**[Experimental]** A markdown-formatted summary of the event.'
              createdBy:
                type: string
                description: Which user created this event
                example: johndoe
              createdByImageUrl:
                type: string
                description: URL used for the user profile image of the event author
                example: https://example.com/242x200.png
              createdAt:
                type: string
                format: date-time
                description: When the event was recorded
                example: '2021-09-01T12:00:00Z'
        owners:
          description: The users and/or groups that have the "owner" role in this project. If no such users or groups exist, the list will contain the "system" owner instead.
          oneOf:
          - type: array
            minItems: 1
            items:
              anyOf:
              - type: object
                required:
                - ownerType
                - name
                properties:
                  ownerType:
                    type: string
                    enum:
                    - user
                  name:
                    type: string
                    example: User Name
                  imageUrl:
                    type: string
                    nullable: true
                    example: https://example.com/image.jpg
                  email:
                    type: string
                    nullable: true
                    example: user@example.com
              - type: object
                required:
                - ownerType
                - name
                properties:
                  ownerType:
                    type: string
                    enum:
                    - group
                  name:
                    type: string
                    example: Group Name
          - type: array
            minItems: 1
            maxItems: 1
            items:
              type: object
              required:
              - ownerType
              properties:
                ownerType:
                  type: string
                  enum:
                  - system
        roles:
          type: array
          description: The list of roles that the user has in this project.
          items:
            type: object
            description: An Unleash role.
            additionalProperties: false
            required:
            - name
            - id
            - type
            properties:
              name:
                type: string
                example: Owner
                description: The name of the role
              id:
                type: integer
                example: 4
                description: The id of the role
              type:
                type: string
                enum:
                - custom
                - project
                example: project
                description: The type of the role
    roleSchema:
      type: object
      description: A role holds permissions to allow Unleash to decide what actions a role holder is allowed to perform
      additionalProperties: false
      required:
      - id
      - type
      - name
      properties:
        id:
          type: integer
          description: The role id
          example: 9
          minimum: 0
        type:
          description: A role can either be a global root role (applies to all projects) or a project role
          type: string
          example: root
        name:
          description: The name of the role
          type: string
          example: Editor
        description:
          description: A more detailed description of the role and what use it's intended for
          type: string
          example: Users with the editor role have access to most features in Unleash but can not manage users and roles in the global scope. Editors will be added as project owners when creating projects and get superuser rights within the context of these projects. Users with the editor role will also get access to most permissions on the default project by default.
        project:
          description: What project the role belongs to
          type: string
          nullable: true
          example: default
    userAccessOverviewSchema:
      type: object
      required:
      - overview
      - user
