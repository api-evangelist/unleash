        version:
          type: integer
          description: The version of the role schema used
          minimum: 1
          example: 1
        roles:
          type: array
          items:
            $ref: '#/components/schemas/roleSchema'
          description: A list of roles
    inactiveUsersSchema:
      type: object
      additionalProperties: false
      description: A list of users that has been flagged as inactive
      required:
      - version
      - inactiveUsers
      properties:
        version:
          description: The version of this schema. Used to keep track of compatibility
          type: integer
          minimum: 1
          example: 1
        inactiveUsers:
          description: The list of users that are flagged as inactive
          type: array
          items:
            $ref: '#/components/schemas/inactiveUserSchema'
    rolesWithVersionSchema:
      type: object
      required:
      - version
      - roles
      description: A collection of user roles
      additionalProperties: false
      properties:
        version:
          description: The version of this schema
          type: integer
          example: 1
          minimum: 1
        roles:
          type: array
          items:
            $ref: '#/components/schemas/roleSchema'
          description: A list of roles
    tagSchema:
      type: object
      description: Representation of a [tag](https://docs.getunleash.io/concepts/feature-flags#tags)
      additionalProperties: false
      required:
      - value
      - type
      properties:
        value:
          type: string
          description: The value of the tag.
          minLength: 2
          maxLength: 50
          example: a-tag-value
        type:
          type: string
          minLength: 2
          maxLength: 50
          description: The [type](https://docs.getunleash.io/concepts/feature-flags#tags) of the tag
          example: simple
        color:
          type: string
          description: The hexadecimal color code for the tag type.
          example: '#FFFFFF'
          pattern: ^#[0-9A-Fa-f]{6}$
          nullable: true
    createUserSchema:
      type: object
      additionalProperties: false
      required:
      - rootRole
      description: The payload must contain at least one of the name and email properties, though which one is up to you. For the user to be able to log in to the system, the user must have an email.
      properties:
        username:
          description: The user's username. Must be provided if email is not provided.
          type: string
          example: hunter
        email:
          description: The user's email address. Must be provided if username is not provided.
          type: string
          example: user@example.com
        name:
          description: The user's name (not the user's username).
          type: string
          example: Sam Seawright
        password:
          type: string
          example: k!5As3HquUrQ
          description: Password for the user
        rootRole:
          description: The role to assign to the user. Can be either the role's ID or its unique name.
          oneOf:
          - type: integer
            example: 1
            minimum: 0
          - type: string
            example: Admin
            enum:
            - Admin
            - Editor
            - Viewer
            - Owner
            - Member
            - Reader
        sendEmail:
          type: boolean
          example: false
          description: Whether to send a welcome email with a login link to the user or not. Defaults to `true`.
    groupSchema:
      type: object
      additionalProperties: false
      required:
      - name
      description: A detailed information about a user group
      properties:
        id:
          description: The group id
          type: integer
          example: 1
        name:
          description: The name of the group
          type: string
          example: DX team
        description:
          description: A custom description of the group
          type: string
          nullable: true
          example: Current members of the DX squad
        mappingsSSO:
          description: A list of SSO groups that should map to this Unleash group
          type: array
          items:
            type: string
          example:
          - SSOGroup1
          - SSOGroup2
        rootRole:
          type: number
          nullable: true
          description: A role id that is used as the root role for all users in this group. This can be either the id of the Viewer, Editor or Admin role.
          example: 1
        createdBy:
          description: A user who created this group
          type: string
          nullable: true
          example: admin
        createdAt:
          description: When was this group created
          type: string
          format: date-time
          nullable: true
          example: '2023-06-30T11:41:00.123Z'
        users:
          type: array
          description: A list of users belonging to this group
          items:
            $ref: '#/components/schemas/groupUserModelSchema'
        projects:
          description: A list of projects where this group is used
          type: array
          items:
            type: string
          example:
          - default
          - my-project
        userCount:
          description: The number of users that belong to this group
          example: 1
          type: integer
          minimum: 0
        scimId:
          description: The SCIM ID of the group, only present if managed by SCIM
          type: string
          nullable: true
          example: 01HTMEXAMPLESCIMID7SWWGHN7
    parametersSchema:
      type: object
      description: A list of parameters for a strategy
      additionalProperties:
        type: string
    idsSchema:
      type: object
      additionalProperties: false
      description: Used for bulk deleting multiple ids
      required:
      - ids
      properties:
        ids:
          type: array
          description: Ids, for instance userid
          items:
            type: number
            minimum: 0
          example:
          - 12
          - 212
    roleWithVersionSchema:
      type: object
      required:
      - version
      - roles
      description: A single user role received after creation or update of a role
      additionalProperties: false
      properties:
        version:
          description: The version of this schema
          type: integer
          example: 1
          minimum: 1
        roles:
          $ref: '#/components/schemas/roleSchema'
          description: A single role
    safeguardTriggerConditionSchema:
      type: object
      required:
      - operator
      - threshold
      additionalProperties: false
      description: The condition that triggers the safeguard.
      properties:
        operator:
          type: string
          enum:
          - '>'
          - <
          description: The comparison operator for the threshold check.
          example: '>'
        threshold:
          type: number
          description: The threshold value to compare against.
          example: 100
    strategyVariantSchema:
      type: object
      additionalProperties: false
      description: This is an experimental property. It may change or be removed as we work on it. Please don't depend on it yet. A strategy variant allows you to attach any data to strategies instead of only returning `true`/`false`. Strategy variants take precedence over feature variants.
      required:
      - name
      - weight
      - weightType
      - stickiness
      properties:
        name:
          type: string
          description: The variant name. Must be unique for this feature flag
          example: blue_group
        weight:
          type: integer
          description: The weight is the likelihood of any one user getting this variant. It is an integer between 0 and 1000. See the section on [variant weights](https://docs.getunleash.io/concepts/feature-flag-variants#variant-weight) for more information
          minimum: 0
          maximum: 1000
        weightType:
          description: Set to `fix` if this variant must have exactly the weight allocated to it. If the type is `variable`, the weight will adjust so that the total weight of all variants adds up to 1000. Refer to the [variant weight documentation](https://docs.getunleash.io/concepts/feature-flag-variants#variant-weight).
          type: string
          example: fix
          enum:
          - variable
          - fix
        stickiness:
          type: string
          description: The [stickiness](https://docs.getunleash.io/concepts/feature-flag-variants#variant-stickiness) to use for distribution of this variant. Stickiness is how Unleash guarantees that the same user gets the same variant every time
          example: custom.context.field
        payload:
          type: object
          required:
          - type
          - value
          description: Extra data configured for this variant
          properties:
            type:
              description: The type of the value. Commonly used types are string, number, json and csv.
              type: string
              enum:
              - json
              - csv
              - string
              - number
            value:
              description: The actual value of payload
              type: string
          example:
            type: json
            value: '{"color": "red"}'
    createGroupSchema:
      type: object
      required:
      - name
      description: A detailed information about a user group
      properties:
        name:
          description: The name of the group
          type: string
          example: DX team
        description:
          description: A custom description of the group
          type: string
          nullable: true
