components:
  schemas:
    constraintSchema:
      additionalProperties: false
      type: object
      required:
      - contextName
      - operator
      description: A strategy constraint. For more information, refer to [the strategy constraint reference documentation](https://docs.getunleash.io/concepts/activation-strategies#constraints)
      properties:
        contextName:
          description: The name of the context field that this constraint should apply to.
          example: appName
          type: string
        operator:
          description: The operator to use when evaluating this constraint. For more information about the various operators, refer to [the strategy constraint operator documentation](https://docs.getunleash.io/concepts/activation-strategies#constraint-operators).
          type: string
          enum:
          - NOT_IN
          - IN
          - STR_ENDS_WITH
          - STR_STARTS_WITH
          - STR_CONTAINS
          - NUM_EQ
          - NUM_GT
          - NUM_GTE
          - NUM_LT
          - NUM_LTE
          - DATE_AFTER
          - DATE_BEFORE
          - SEMVER_EQ
          - SEMVER_GT
          - SEMVER_LT
          example: IN
        caseInsensitive:
          description: Whether the operator should be case sensitive or not. Defaults to `false` (being case sensitive).
          type: boolean
          default: false
        inverted:
          description: Whether the result should be negated or not. If `true`, will turn a `true` result into a `false` result and vice versa.
          type: boolean
          default: false
        values:
          type: array
          description: The context values that should be used for constraint evaluation. Use this property instead of `value` for properties that accept multiple values.
          items:
            type: string
          example:
          - my-app
          - my-other-app
        value:
          description: The context value that should be used for constraint evaluation. Use this property instead of `values` for properties that only accept single values.
          type: string
          example: my-app
    featureSchema:
      type: object
      additionalProperties: false
      required:
      - name
      description: A feature flag definition
      properties:
        name:
          type: string
          example: disable-comments
          description: Unique feature name
        type:
          type: string
          example: kill-switch
          description: Type of the flag e.g. experiment, kill-switch, release, operational, permission
        description:
          type: string
          nullable: true
          example: Controls disabling of the comments section in case of an incident
          description: Detailed description of the feature
        archived:
          type: boolean
          example: true
          description: '`true` if the feature is archived'
        project:
          type: string
          example: dx-squad
          description: Name of the project the feature belongs to
        enabled:
          type: boolean
          example: true
          description: '`true` if the feature is enabled, otherwise `false`.'
        stale:
          type: boolean
          example: false
          description: '`true` if the feature is stale based on the age and feature type, otherwise `false`.'
        favorite:
          type: boolean
          example: true
          description: '`true` if the feature was favorited, otherwise `false`.'
        impressionData:
          type: boolean
          example: false
          description: '`true` if the impression data collection is enabled for the feature, otherwise `false`.'
        createdAt:
          type: string
          format: date-time
          nullable: true
          example: '2023-01-28T15:21:39.975Z'
          description: The date the feature was created
        createdBy:
          type: object
          description: User who created the feature flag
          additionalProperties: false
          required:
          - id
          - name
          - imageUrl
          properties:
            id:
              description: The user id
              type: integer
              example: 123
            name:
              description: Name of the user
              type: string
              example: User
            imageUrl:
              description: URL used for the user profile image
              type: string
              example: https://example.com/242x200.png
        archivedAt:
          type: string
          format: date-time
          nullable: true
          example: '2023-01-29T15:21:39.975Z'
          description: The date the feature was archived
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
          deprecated: true
          example: '2023-01-28T16:21:39.975Z'
          description: The date when metrics where last collected for the feature. This field was deprecated in v5, use the one in featureEnvironmentSchema
        environments:
          type: array
          items:
            $ref: '#/components/schemas/featureEnvironmentSchema'
          description: The list of environments where the feature can be used
        variants:
          type: array
          items:
            $ref: '#/components/schemas/variantSchema'
          description: The list of feature variants
          deprecated: true
        strategies:
          type: array
          items:
            type: object
          description: This was deprecated in v5 and will be removed in a future major version
          deprecated: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/tagSchema'
          nullable: true
          description: The list of feature tags
        children:
          type: array
          description: The list of child feature names. This is an experimental field and may change.
          items:
            type: string
            example: some-feature
        lifecycle:
          type: object
          description: Current lifecycle stage of the feature
          additionalProperties: false
          required:
          - stage
          - enteredStageAt
          properties:
            stage:
              description: The name of the current lifecycle stage
              type: string
              enum:
              - initial
              - pre-live
              - live
              - completed
              - archived
              example: initial
            status:
              type: string
              nullable: true
              example: kept
              description: The name of the detailed status of a given stage. E.g. completed stage can be kept or discarded.
            enteredStageAt:
              description: When the feature entered this stage
              type: string
              format: date-time
              example: '2023-01-28T15:21:39.975Z'
        dependencies:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - feature
            properties:
              feature:
                description: The name of the parent feature
                type: string
                example: some-feature
              enabled:
                description: Whether the parent feature is enabled or not
                type: boolean
                example: true
              variants:
                description: The list of variants the parent feature should resolve to. Only valid when feature is enabled.
                type: array
                items:
                  example: some-feature-blue-variant
                  type: string
          description: The list of parent dependencies. This is an experimental field and may change.
        collaborators:
          type: object
          required:
          - users
          description: Information related to users who have made changes to this feature flage.
          properties:
            users:
              description: Users who have made any changes to this feature flags. The list is sorted in reverse chronological order (most recent changes first)
              type: array
              items:
                type: object
                required:
                - id
                - name
                - imageUrl
                description: A simple representation of a user.
                properties:
                  id:
                    description: The user's id
                    type: integer
                    example: 123
                  name:
                    description: The user's name, username, or email (prioritized in that order). If none of those are present, this property will be set to the string `unknown`
                    type: string
                    example: User
                  imageUrl:
                    description: The URL to the user's profile image
                    type: string
                    example: https://example.com/242x200.png
        links:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - url
            properties:
              id:
                type: string
                example: 01JTJNCJ5XVP2KPJFA03YRBZCA
                description: The id of the link
              url:
                type: string
                example: https://github.com/search?q=cleanupReminder&type=code
                description: The URL the feature is linked to
              title:
                type: string
                example: Github cleanup
                description: The description of the link
                nullable: true
              feature:
                type: string
                example: disable-comments
                description: The name of the feature this link belongs to
          description: The list of links. This is an experimental field and may change.
    usersSchema:
      type: object
      additionalProperties: false
      description: Users and root roles
      required:
      - users
      properties:
        users:
          type: array
          description: A list of users in the Unleash instance.
          items:
            $ref: '#/components/schemas/userSchema'
        rootRoles:
          type: array
          description: A list of [root roles](https://docs.getunleash.io/concepts/rbac#predefined-roles) in the Unleash instance.
          items:
            $ref: '#/components/schemas/roleSchema'
    featureStrategySchema:
      description: A single activation strategy configuration schema for a feature
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        id:
          type: string
          description: A uuid for the feature strategy
          example: 6b5157cb-343a-41e7-bfa3-7b4ec3044840
        name:
          type: string
          description: The name or type of strategy
          example: flexibleRollout
        title:
          type: string
          description: A descriptive title for the strategy
          example: Gradual Rollout 25-Prod
          nullable: true
        disabled:
          type: boolean
          description: A toggle to disable the strategy. defaults to false. Disabled strategies are not evaluated or returned to the SDKs
          example: false
          nullable: true
        featureName:
          type: string
          description: The name or feature the strategy is attached to
          example: myAwesomeFeature
        sortOrder:
          type: number
          description: The order of the strategy in the list
          example: 9999
        segments:
          type: array
          description: A list of segment ids attached to the strategy
          example:
          - 1
          - 2
          items:
            type: number
        constraints:
          type: array
          description: A list of the constraints attached to the strategy. See https://docs.getunleash.io/concepts/activation-strategies#constraints
          items:
            $ref: '#/components/schemas/constraintSchema'
        variants:
          type: array
          description: Strategy level variants
          items:
            $ref: '#/components/schemas/strategyVariantSchema'
        parameters:
          $ref: '#/components/schemas/parametersSchema'
    adminPermissionSchema:
      type: object
      required:
      - id
      - name
      - displayName
      - type
      additionalProperties: false
      description: Describes a single permission
      properties:
        id:
          type: integer
          description: The identifier for this permission
          example: 3
        name:
          type: string
          description: The name of this permission
          example: UPDATE_FEATURE
        displayName:
          type: string
          description: The name to display in listings of permissions
          example: Update feature flags
        type:
          type: string
          description: What level this permission applies to. Either root, project or the name of the environment it applies to
          example: project
        environment:
          description: Which environment this permission applies to
          type: string
          example: development
          nullable: true
    userSchema:
      type: object
      additionalProperties: false
      description: An Unleash user
      required:
      - id
      properties:
        id:
          description: The user id
          type: integer
          example: 123
        name:
          description: Name of the user
          type: string
          example: User
          nullable: true
        email:
          description: Email of the user
          type: string
          example: user@example.com
        username:
          description: A unique username for the user
          type: string
          example: hunter
          nullable: true
        imageUrl:
          description: URL used for the user profile image
          type: string
          example: https://example.com/242x200.png
        inviteLink:
          description: If the user is actively inviting other users, this is the link that can be shared with other users
          type: string
          example: http://localhost:4242/invite-link/some-secret
        loginAttempts:
          description: How many unsuccessful attempts at logging in has the user made
          type: integer
          minimum: 0
          example: 3
        emailSent:
          description: Is the welcome email sent to the user or not
          type: boolean
          example: false
        rootRole:
          description: Which [root role](https://docs.getunleash.io/concepts/rbac#predefined-roles) this user is assigned
          type: integer
          example: 1
          minimum: 0
        seenAt:
          description: The last time this user logged in
          type: string
          format: date-time
          nullable: true
          example: '2023-06-30T11:42:00.345Z'
        createdAt:
          description: The user was created at this time
          type: string
          format: date-time
          example: '2023-06-30T11:41:00.123Z'
        accountType:
          description: A user is either an actual User or a Service Account
          type: string
          enum:
          - User
          - Service Account
          example: User
        permissions:
          description: Deprecated
          type: array
          items:
            type: string
        scimId:
          description: The SCIM ID of the user, only present if managed by SCIM
          type: string
          nullable: true
          example: 01HTMEXAMPLESCIMID7SWWGHN6
        seatType:
          description: The seat type of this user
          type: string
          nullable: true
          example: Regular
        activeSessions:
          description: Count of active browser sessions for this user
          type: integer
          nullable: true
          example: 2
        deletedSessions:
          description: Experimental. The number of deleted browser sessions after last login
          type: number
          example: 1
    groupsSchema:
      type: object
      additionalProperties: false
      description: A list of [user groups](https://docs.getunleash.io/concepts/rbac#user-groups)
      properties:
        groups:
          description: A list of groups
          type: array
          items:
            $ref: '#/components/schemas/groupSchema'
    profileSchema:
      type: object
      additionalProperties: false
      description: User profile overview
      required:
      - rootRole
      - projects
      - features
      - subscriptions
      properties:
        rootRole:
          $ref: '#/components/schemas/roleSchema'
        projects:
          description: Which projects this user is a member of
          type: array
          items:
            type: string
          example:
          - my-projectA
          - my-projectB
        subscriptions:
          description: Which email subscriptions this user is subscribed to
          type: array
          items:
            type: string
          example:
          - productivity-report
        features:
          description: Deprecated, always returns empty array
          type: array
          items:
            $ref: '#/components/schemas/featureSchema'
          example: []
    variantSchema:
      type: object
      additionalProperties: false
      description: A variant allows for further separation of users into segments. See [our excellent documentation](https://docs.getunleash.io/concepts/feature-flag-variants#what-are-variants) for a more detailed description
      required:
      - name
      - weight
      properties:
        name:
          type: string
          description: The variants name. Is unique for this feature flag
          example: blue_group
        weight:
          type: number
          description: The weight is the likelihood of any one user getting this variant. It is a number between 0 and 1000. See the section on [variant weights](https://docs.getunleash.io/concepts/feature-flag-variants#variant-weight) for more information
          minimum: 0
          maximum: 1000
        weightType:
          description: Set to fix if this variant must have exactly the weight allocated to it. If the type is variable, the weight will adjust so that the total weight of all variants adds up to 1000
          type: string
          example: variable
          enum:
          - variable
          - fix
        stickiness:
          type: string
          description: '[Stickiness](https://docs.getunleash.io/concepts/feature-flag-variants#variant-stickiness) is how Unleash guarantees that the same user gets the same variant every time'
          example: custom.context.field
        payload:
          type: object
          required:
          - type
          - value
          description: Extra data configured for this variant
          additionalProperties: false
          properties:
            type:
              description: The type of the value. Commonly used types are string, number, json and csv.
              type: string
              enum:
              - json
              - csv
              - string
              - number
            value:
              description: The actual value of payload
              type: string
          example:
            type: json
            value: '{"color": "red"}'
        overrides:
          description: Overrides assigning specific variants to specific users. The weighting system automatically assigns users to specific groups for you, but any overrides in this list will take precedence.
          type: array
          items:
            $ref: '#/components/schemas/overrideSchema'
    releasePlanMilestoneStrategySchema:
      additionalProperties: false
      description: Schema representing the creation of a release plan milestone strategy.
      type: object
      required:
      - id
      - milestoneId
      - sortOrder
      - strategyName
      properties:
        id:
          type: string
          description: The milestone strategy's ID. Milestone strategy IDs are ulids.
          example: 01JB9GGTGQYEQ9D40R17T3YVW3
          nullable: false
        milestoneId:
          type: string
          description: The ID of the milestone that this strategy belongs to.
          example: 01JB9GGTGQYEQ9D40R17T3YVW1
        sortOrder:
          type: number
          description: The order of the strategy in the list
          example: 9999
        title:
          type: string
          nullable: true
          description: A descriptive title for the strategy
          example: Gradual Rollout 25-Prod
        strategyName:
          type: string
          description: The name of the strategy type
          example: flexibleRollout
        parameters:
          description: An object containing the parameters for the strategy
          example:
            groupId: some_new
            rollout: '25'
            stickiness: sessionId
          $ref: '#/components/schemas/parametersSchema'
        constraints:
          type: array
          description: A list of the constraints attached to the strategy. See https://docs.getunleash.io/concepts/activation-strategies#constraints
          example:
          - values:
            - '1'
            - '2'
            inverted: false
            operator: IN
            contextName: appName
            caseInsensitive: false
          items:
            $ref: '#/components/schemas/constraintSchema'
        variants:
          type: array
          description: Strategy level variants
          items:
            $ref: '#/components/schemas/createStrategyVariantSchema'
        segments:
          type: array
          description: Ids of segments to use for this strategy
          example:
          - 1
          - 2
          items:
            type: number
    createRoleWithPermissionsSchema:
      type: object
      description: A write model for the custom role and permissions to allow Unleash to decide what actions a role holder is allowed to perform
      anyOf:
      - type: object
        required:
        - name
        properties:
          name:
            description: The name of the custom role
            type: string
            example: external-contributors
          description:
            description: A more detailed description of the custom role and what use it's intended for
            type: string
            example: Users with external-contributors role have limited access to most features in Unleash
          type:
            description: '[Custom root roles](https://docs.getunleash.io/concepts/rbac#custom-root-roles) (type=root-custom) are root roles with a custom set of permissions. [Custom project roles](https://docs.getunleash.io/concepts/rbac#custom-project-roles) (type=custom) contain a specific set of permissions for project resources.'
            type: string
            enum:
            - root-custom
            - custom
            example: root-custom
          permissions:
            type: array
            description: A list of permissions assigned to this role
            items:
              type: object
              required:
              - name
              properties:
                name:
                  description: The name of the permission
                  type: string
                  example: CREATE_PROJECT
                environment:
                  type: string
                  nullable: true
                  example: development
                  description: The environments of the permission if the permission is environment specific
      - type: object
        required:
        - name
        properties:
          name:
            description: The name of the custom role
            type: string
            example: external-contributors
          description:
            description: A more detailed description of the custom role and what use it's intended for
            type: string
            example: Users with external-contributors role have limited access to most features in Unleash
          type:
            description: '[Custom project roles](https://docs.getunleash.io/concepts/rbac#custom-project-roles) contain a specific set of permissions for project resources.'
            type: string
            enum:
            - custom
            example: custom
          permissions:
            type: array
            description: A list of permissions assigned to this role
            items:
              type: object
              required:
              - id
              properties:
                id:
                  description: The id of the permission
                  type: number
                  example: 2
                name:
                  description: The name of the permission
                  type: string
                  example: CREATE_PROJECT
                environment:
                  type: string
                  nullable: true
                  example: development
                  description: The environments of the permission if the permission is environment specific
    resetPasswordSchema:
      type: object
      description: Data used to provide users a way to reset their passwords.
      additionalProperties: false
      required:
      - resetPasswordUrl
      properties:
        resetPasswordUrl:
          description: A URL pointing to a location where the user can reset their password
          type: string
          format: uri
          example: https://unleash.reset.com
    roleWithPermissionsSchema:
      type: object
      description: A read model for the role and permissions to allow Unleash to decide what actions a role holder is allowed to perform
      required:
      - id
      - type
      - name
      - permissions
      additionalProperties: false
      properties:
        id:
          description: The role id
          type: number
          example: 9
        type:
          description: A role can either be a global `root` role, or a `project` role or a `custom` project role or a custom global `root-custom` role
          type: string
          example: root
        name:
          description: The name of the role
          type: string
          example: Editor
        description:
          description: A more detailed description of the role and what use it's intended for
          type: string
          example: Users with the editor role have access to most features in Unleash but can not manage users and roles in the global scope. Editors will be added as project owners when creating projects and get superuser rights within the context of these projects. Users with the editor role will also get access to most permissions on the default project by default.
        permissions:
          description: A list of permissions assigned to this role
          type: array
          items:
            $ref: '#/components/schemas/adminPermissionSchema'
    groupUserModelSchema:
      type: object
      additionalProperties: false
      required:
      - user
      description: Details for a single user belonging to a group
      properties:
        joinedAt:
          description: The date when the user joined the group
          type: string
          format: date-time
          example: '2023-06-30T11:41:00.123Z'
        createdBy:
          description: The username of the user who added this user to this group
          type: string
          nullable: true
          example: admin
        user:
          $ref: '#/components/schemas/userSchema'
    overrideSchema:
      type: object
      additionalProperties: false
      required:
      - contextName
      - values
      description: An override for deciding which variant should be assigned to a user based on the context name
      properties:
        contextName:
          description: The name of the context field used to determine overrides
          type: string
          example: userId
        values:
          description: Which values that should be overriden
          type: array
          items:
            type: string
          example:
          - red
          - blue
    passwordSchema:
      type: object
      additionalProperties: false
      required:
      - password
      description: Fields used to create new password or update old password
      properties:
        password:
          type: string
          example: k!5As3HquUrQ
          description: The new password to change or validate.
        oldPassword:
          type: string
          example: Oldk!5As3HquUrQ
          description: The old password the user is changing. This field is for the non-admin users changing their own password.
        confirmPassword:
          type: string
          example: k!5As3HquUrQ
          description: The confirmation of the new password. This field is for the non-admin users changing their own password.
    adminCountSchema:
      type: object
      additionalProperties: false
      description: Contains total admin counts for an Unleash instance.
      required:
      - password
      - noPassword
      - service
      properties:
        password:
          type: number
          description: Total number of admins that have a password set.
        noPassword:
          type: number
          description: Total number of admins that do not have a password set. May be SSO, but may also be users that did not set a password yet.
        service:
          type: number
          description: Total number of service accounts that have the admin root role.
    createUserResponseSchema:
      type: object
      additionalProperties: false
      description: An Unleash user after creation
      required:
      - id
      properties:
        id:
          description: The user id
          type: integer
          example: 123
        name:
          description: Name of the user
          type: string
          example: User
          nullable: true
        email:
          description: Email of the user
          type: string
          example: user@example.com
        username:
          description: A unique username for the user
          type: string
          example: hunter
          nullable: true
        imageUrl:
          description: URL used for the user profile image
          type: string
          example: https://example.com/242x200.png
        inviteLink:
          description: If the user is actively inviting other users, this is the link that can be shared with other users
          type: string
          example: http://localhost:4242/invite-link/some-secret
        loginAttempts:
          description: How many unsuccessful attempts at logging in has the user made
          type: integer
          minimum: 0
          example: 3
        emailSent:
          description: Is the welcome email sent to the user or not
          type: boolean
          example: false
        rootRole:
          description: Which [root role](https://docs.getunleash.io/concepts/rbac#predefined-roles) this user is assigned. Usually a numeric role ID, but can be a string when returning newly created user with an explicit string role.
          oneOf:
          - type: integer
            example: 1
            minimum: 0
          - type: string
            example: Admin
            enum:
            - Admin
            - Editor
            - Viewer
            - Owner
            - Member
            - Reader
        seenAt:
          description: The last time this user logged in
          type: string
          format: date-time
          nullable: true
          example: '2023-06-30T11:42:00.345Z'
        createdAt:
          description: The user was created at this time
          type: string
          format: date-time
          example: '2023-06-30T11:41:00.123Z'
        accountType:
          description: A user is either an actual User or a Service Account
          type: string
          enum:
          - User
          - Service Account
          example: User
        permissions:
          description: Deprecated
          type: array
          items:
            type: string
        scimId:
          description: The SCIM ID of the user, only present if managed by SCIM
          type: string
          nullable: true
          example: 01HTMEXAMPLESCIMID7SWWGHN6
        seatType:
          description: The seat type of this user
          type: string
          nullable: true
          example: Regular
        activeSessions:
          description: Count of active browser sessions for this user
          type: integer
          nullable: true
          example: 2
        deletedSessions:
          description: Experimental. The number of deleted browser sessions after last login
          type: number
          example: 1
    permissionSchema:
      type: object
      additionalProperties: false
      required:
      - permission
      description: Project and environment permissions
      properties:
        permission:
          description: '[Project](https://docs.getunleash.io/concepts/rbac#project-level-permissions) or [environment](https://docs.getunleash.io/concepts/rbac#environment-level-permissions) permission name'
          type: string
          example: UPDATE_FEATURE_STRATEGY
        project:
          description: The project this permission applies to
          type: string
          example: my-project
        environment:
          description: The environment this permission applies to
          type: string
          example: development
    releasePlanMilestoneSchema:
      additionalProperties: false
      description: Schema representing the creation of a release plan milestone.
      type: object
      required:
      - id
      - name
      - sortOrder
      - releasePlanDefinitionId
      properties:
        id:
          type: string
          description: The milestone's ID. Milestone IDs are ulids.
          example: 01JB9GGTGQYEQ9D40R17T3YVW1
          nullable: false
        name:
          type: string
          description: The name of the milestone.
          example: My milestone
        sortOrder:
          type: integer
          description: The order of the milestone in the release plan.
          example: 1
        releasePlanDefinitionId:
          type: string
          description: The ID of the release plan/template that this milestone belongs to.
          example: 01JB9GGTGQYEQ9D40R17T3YVW2
        startedAt:
          type: string
          format: date-time
          description: The date and time when the milestone was started.
          example: '2024-01-01T00:00:00.000Z'
          nullable: true
        transitionCondition:
          type: object
          additionalProperties: false
          required:
          - intervalMinutes
          properties:
            intervalMinutes:
              type: integer
              minimum: 1
              description: The interval in minutes before transitioning
              example: 30
          description: The condition configuration for the transition
          nullable: true
        progressionExecutedAt:
          type: string
          format: date-time
          description: The date and time when the milestone progression was executed.
          example: '2024-01-01T00:00:00.000Z'
          nullable: true
        pausedAt:
          type: string
          format: date-time
          description: The date and time when the milestone was paused.
          example: '2024-01-01T00:00:00.000Z'
          nullable: true
        strategies:
          type: array
          description: A list of strategies that are attached to this milestone.
          items:
            $ref: '#/components/schemas/releasePlanMilestoneStrategySchema'
    releasePlanSchema:
      additionalProperties: false
      description: Schema representing the creation of a release plan.
      type: object
      required:
      - id
      - discriminator
      - name
      - featureName
      - environment
      - createdByUserId
      - createdAt
      - milestones
      - releasePlanTemplateId
      properties:
        id:
          type: string
          description: The release plan/template's ID. Release template IDs are ulids.
          example: 01JB9GGTGQYEQ9D40R17T3YVW2
          nullable: false
        discriminator:
          type: string
          description: A field to distinguish between release plans and release templates.
          example: plan
          nullable: false
          enum:
          - plan
        name:
          type: string
          description: The name of the release template.
          example: My release plan
        description:
          type: string
          description: A description of the release template.
          example: This is my release plan
          nullable: true
        featureName:
          type: string
          description: The name of the feature that uses this release plan.
          example: my-feature
        environment:
          type: string
          description: The environment that this release plan is for.
          example: production
        createdByUserId:
          type: number
          description: 'Release template: The ID of the user who created this template.'
          example: 53
          nullable: false
        createdAt:
          type: string
          format: date-time
          description: The date and time that the release template was created.
          example: '2022-01-01T00:00:00Z'
          nullable: false
        activeMilestoneId:
          type: string
          description: The ID of the currently active milestone in this release plan.
          example: 01JB9GGTGQYEQ9D40R17T3YVW1
          nullable: true
        milestones:
          type: array
          description: A list of the milestones in this release template.
          items:
            $ref: '#/components/schemas/releasePlanMilestoneSchema'
        releasePlanTemplateId:
          type: string
          description: The ID of the release plan template that this release plan is based on.
          example: 01JB9GGTGQYEQ9D40R17T3YVW2
          nullable: false
        safeguards:
          type: array
          description: An array of safeguards configured for this release plan.
          items:
            $ref: '#/components/schemas/safeguardSchema'
    idSchema:
      type: object
      additionalProperties: false
      description: Email id used for password reset
      required:
      - id
      properties:
        id:
          type: string
          description: User email
          example: user@example.com
    safeguardSchema:
      type: object
      required:
      - id
      - action
      - triggerCondition
      - impactMetric
      description: A safeguard configuration for a release plan.
      additionalProperties: false
      properties:
        id:
          type: string
          description: The unique ULID identifier for this safeguard
          example: 01JB9GGTGQYEQ9D40R17T3YVW1
        action:
          type: object
          required:
          - type
          - id
          additionalProperties: false
          description: The action to take when the safeguard is triggered.
          properties:
            type:
              type: string
              description: The type of action to perform.
              example: pauseReleasePlanProgressions
            id:
              type: string
              description: The ID of the release plan this safeguard applies to.
              example: 01JB9GGTGQYEQ9D40R17T3YVW2
        triggerCondition:
          $ref: '#/components/schemas/safeguardTriggerConditionSchema'
          description: The condition that triggers the safeguard.
        impactMetric:
          type: object
          required:
          - id
          - metricName
          - timeRange
          - aggregationMode
          - labelSelectors
          additionalProperties: false
          properties:
            id:
              type: string
              description: The unique identifier for this impact metric
              example: 01JB9GGTGQYEQ9D40R17T3YVW1
            metricName:
              type: string
              description: The Prometheus metric series to query. It includes both unleash prefix and metric type and display name
              example: unleash_counter_feature_toggle_usage_total
            timeRange:
              type: string
              enum:
              - hour
              - day
              - week
              - month
              description: The time range for the metric data.
              example: day
            aggregationMode:
              type: string
              description: The aggregation mode for the metric data.
              enum:
              - rps
              - count
              - avg
              - sum
              - p95
              - p99
              - p50
              example: rps
            labelSelectors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
              description: The selected labels and their values for filtering the metric data.
              example:
                environment:
                - development
                project:
                - default
          description: The metric configuration used to evaluate the safeguard condition.
    inactiveUserSchema:
